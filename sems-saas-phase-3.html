  function lookupZip(zip) {
    if (!zip || typeof zip !== 'string') return null;
    const five = zip.replace(/[^\d]/g, '').slice(0, 5);
    if (five.length !== 5) return null;

    const prefix2 = five.slice(0, 2);
    const prefix3 = five.slice(0, 3);
    const state = ZIP_PREFIX_TO_STATE[prefix2];
    if (!state) return null;

    const base = STATE_CLIMATE[state];
    if (!base) return null;

    const overlay = ZIP3_OVERLAY[prefix3] || {};
    return {
      zip: five,
      state,
      wind:    overlay.wind    ?? base.wind,
      exp:     overlay.exp     ?? base.exp,
      snow:    overlay.snow    ?? base.snow,
      frost:   overlay.frost   ?? base.frost,
      sds:     overlay.sds     ?? base.sds,
      seismic: overlay.seismic ?? base.seismic,
      irr:     overlay.irr     ?? base.irr,
      descr:   overlay.descr   ?? base.descr
    };
  }

  // Try to extract a 5-digit ZIP from any address-like string
  function findZipInString(s) {
    if (!s) return null;
    const m = String(s).match(/\b(\d{5})\b/);
    return m ? m[1] : null;
  }

  /* ────────────────────────────────────────────────────────────────────────
     ENGINEERING CALCS · ASCE 7-22 simplified (matches host configurator
     where possible; explanations make the math visible).
     ──────────────────────────────────────────────────────────────────────── */
  function v(id, fb) {
    const el = document.getElementById(id);
    if (!el) return fb;
    const n = parseFloat(el.value);
    return isNaN(n) ? fb : n;
  }
  function s(id, fb) {
    const el = document.getElementById(id);
    return el ? (el.value || fb || '') : (fb || '');
  }

  // Velocity pressure exposure coefficient Kz · ASCE 7-22 Table 26.10-1
  // Uses simplified formula: Kz = 2.01 * (z/zg)^(2/alpha)
  // For solar arrays the typical mean roof height z is 6-15 ft (low rise).
  function computeKz(exp, height) {
    const params = { B: { alpha: 7.0, zg: 1200 }, C: { alpha: 9.5, zg: 900 }, D: { alpha: 11.5, zg: 700 } };
    const p = params[exp] || params.C;
    const z = Math.max(15, height); // ASCE 7-22 §26.10.1 minimum z = 15 ft
    return 2.01 * Math.pow(z / p.zg, 2 / p.alpha);
  }

  function computeWindPressure() {
    const V    = v('windSpeed', 110);
    const exp  = s('exposureCat', 'C');
    const Kzt  = v('kzt', 1.0);
    const Ke   = v('ke', 1.0);
    const Kd   = 0.85; // ASCE 7-22 Table 26.6-1 for solar panels (other structures)
    const G    = 0.85; // gust effect factor
    const z    = 8;    // typical mean height of low-tilt PV array in ft
    const Kz   = computeKz(exp, z);

    // q_z = 0.00256 * Kz * Kzt * Kd * Ke * V^2  (psf, V in mph)
    const qz = 0.00256 * Kz * Kzt * Kd * Ke * V * V;

    // Net design pressure (simplified all-zone envelope for components & cladding)
    // p = qz * G * (GCp - GCpi). For rooftop solar, conservative GCp range ≈ +1.0 / -1.6.
    const GCp_max = -1.6, GCpi = 0.18;
    const p_uplift = qz * G * (Math.abs(GCp_max) + GCpi);

    return { V, exp, Kzt, Ke, Kd, G, z, Kz, qz, p_uplift };
  }

  function computeSnowLoad() {
    const pg = v('snowLoad', 25);          // ground snow load (psf)
    const Ce = 1.0, Ct = 1.2, Is = 1.0;    // exposure / thermal / importance
    // Solar arrays at low tilt typically use Cs ≈ 1.0 (no slope reduction below 30°)
    const Cs = 1.0;
    const pf = 0.7 * Ce * Ct * Is * pg;
    const ps = Cs * pf;
    return { pg, Ce, Ct, Is, pf, Cs, ps };
  }

  function computeSeismic() {
    const SDS  = v('sds', 0.15);
    const cat  = s('seismicCat', 'A');
    const Ip   = 1.0;       // importance factor for solar
    const ap   = 1.0;       // component amplification (rigid)
    const Rp   = 2.5;       // response modification
    const z_h  = 0.3;       // low-rise: assume z/h ≈ 0.3
    // F_p / W_p = 0.4 * a_p * S_DS * (1 + 2*z/h) * I_p / R_p
    const fpw  = 0.4 * ap * SDS * (1 + 2 * z_h) * Ip / Rp;
    return { SDS, cat, Ip, ap, Rp, z_h, fpw };
  }

  /* ────────────────────────────────────────────────────────────────────────
     PV PRODUCTION · simplified PVWatts model
     ──────────────────────────────────────────────────────────────────────── */
  function computeProduction() {
    const layout = host_layout();
    const panelW = v('panelWidth', 41.3);
    const panelWatt = v('panelWattage', 430);
    let modules = 0;
    layout.forEach(r => (r.sections || []).forEach(sec => {
      try {
        const mc = window.getSectionModuleCount(sec.type, panelW);
        modules += mc.modules || 0;
      } catch {}
    }));
    const kwDC = (modules * panelWatt) / 1000;

    // Determine site irradiance from ZIP / state.
    const addr = s('siteAddress', '') + ' ' + s('siteName', '');
    const zip = findZipInString(addr);
    const z = zip ? lookupZip(zip) : null;
    const stateCode = z?.state;
    const irr = z?.irr || (stateCode && STATE_CLIMATE[stateCode]?.irr) || 4.5; // default kWh/m²/day

    // PVWatts-style derate
    const losses = {
      soiling: 0.02,
      shading: 0.03,
      snow: 0.00,
      mismatch: 0.02,
      wiring: 0.02,
      connections: 0.005,
      lightInducedDeg: 0.015,
      nameplate: 0.01,
      age: 0.015
    };
    const totalLoss = Object.values(losses).reduce((a, b) => a + b, 0);
    const dcAcRatio = 1.20;
    const inverterEff = 0.96;
    const tempCoeff = 0.85;     // typical year-round derate for fixed tilt

    // Annual energy: kWh/year ≈ kW_DC × irradiance × 365 × tempCoeff × (1 - losses) × inverterEff
    const kwhYear = kwDC * irr * 365 * tempCoeff * (1 - totalLoss) * inverterEff;
    const cf = kwDC > 0 ? (kwhYear / (kwDC * 8760)) : 0;
    const valuePerKwh = 0.10; // default $/kWh
    const valueYr = kwhYear * valuePerKwh;

    return { kwDC, modules, irr, kwhYear, cf, valueYr, losses, totalLoss, dcAcRatio, inverterEff, tempCoeff, zip };
  }

  /* ────────────────────────────────────────────────────────────────────────
     COST ROLL-UP · per-line BOM costs
     ──────────────────────────────────────────────────────────────────────── */
  // Default unit costs (editable in the UI later). Values are conservative
  // 2025 estimates for utility-scale ground-mount; intentionally rough.
  const COST_TABLE = {
    modules: 0.28,            // $/W
    inverter: 0.06,           // $/W
    optimizer: 0.05,          // $/W (when optimizers enabled)
    racking: 0.13,            // $/W (Avans series racking)
    foundation: 0.08,         // $/W (driven pile)
    bos: 0.07,                // $/W (wire, conduit, MLPE allowance)
    labor: 0.20,              // $/W (turnkey labor)
    overhead: 0.05,           // $/W (project mgmt, permits, design)
    contingency: 0.04         // $/W (5% bucket)
  };

  function computeCost() {
    const prod = computeProduction();
    const kwDC = prod.kwDC;
    const watts = kwDC * 1000;
    const optEnabled = document.getElementById('optimizerEnabled')?.checked;

    const lines = [
      { key: 'modules',     label: 'Modules',                 perW: COST_TABLE.modules,     color: '#2660A4' },
      { key: 'inverter',    label: 'Inverters',               perW: COST_TABLE.inverter,    color: '#3B8FDB' },
      ...(optEnabled ? [{ key: 'optimizer', label: 'DC optimizers', perW: COST_TABLE.optimizer, color: '#5BBCE4' }] : []),
      { key: 'racking',     label: 'Avans racking',           perW: COST_TABLE.racking,     color: '#1B3A5C' },
      { key: 'foundation',  label: 'Foundations',             perW: COST_TABLE.foundation,  color: '#0e7490' },
      { key: 'bos',         label: 'Balance of system',       perW: COST_TABLE.bos,         color: '#15803d' },
      { key: 'labor',       label: 'Labor',                   perW: COST_TABLE.labor,       color: '#b45309' },
      { key: 'overhead',    label: 'Permitting / overhead',   perW: COST_TABLE.overhead,    color: '#7c3aed' },
      { key: 'contingency', label: 'Contingency',             perW: COST_TABLE.contingency, color: '#475569' }
    ];

    lines.forEach(l => l.cost = l.perW * watts);
    const total = lines.reduce((a, l) => a + l.cost, 0);
    const totalPerW = kwDC > 0 ? (total / watts) : 0;
    return { lines, total, totalPerW, kwDC };
  }

  /* ────────────────────────────────────────────────────────────────────────
     ENGINEERING CONSOLE
     ──────────────────────────────────────────────────────────────────────── */
  function buildEngConsole() {
    const c = document.createElement('aside');
    c.className = 'saas-engcon';
    c.id = 'saas-engcon';
    c.innerHTML = `
      <div class="saas-engcon-head">
        <div class="saas-engcon-title">Live Engineering</div>
        <button class="saas-modal-close" id="saas-engcon-close">×</button>
      </div>
      <div class="saas-engcon-body" id="saas-engcon-body"></div>
    `;
    document.body.appendChild(c);
    document.getElementById('saas-engcon-close').addEventListener('click', () => SAAS.engcon.close());

    SAAS.engcon = {
      open() {
        c.classList.add('show');
        renderEng();
      },
      close() { c.classList.remove('show'); },
      refresh: renderEng
    };

    // Add to FAB stack and palette.
    const fabs = document.getElementById('saas-fabs');
    if (fabs) {
      const btn = document.createElement('button');
      btn.className = 'saas-fab';
      btn.id = 'saas-fab-engcon';
      btn.innerHTML = `Σ<span class="saas-fab-tooltip">Live engineering</span>`;
      btn.addEventListener('click', () => SAAS.engcon.open());
      // Insert below the templates fab so the wizard stays primary
      fabs.insertBefore(btn, fabs.firstChild);
    }

    // Add a rail icon too
    const rail = document.getElementById('saas-rail');
    if (rail) {
      const railBtn = document.createElement('button');
      railBtn.className = 'saas-rail-item';
      railBtn.dataset.action = 'engcon';
      railBtn.innerHTML = `<span>Σ</span><span class="saas-rail-tooltip">Live engineering console</span>`;
      railBtn.addEventListener('click', () => SAAS.engcon.open());
      // Insert before the spacer + palette/projects buttons
      const spacer = rail.querySelector('.saas-rail-spacer');
      if (spacer) rail.insertBefore(railBtn, spacer);
    }
  }

  function renderEng() {
    const body = document.getElementById('saas-engcon-body');
    if (!body) return;

    const wind = computeWindPressure();
    const snow = computeSnowLoad();
    const seism = computeSeismic();
    const prod = computeProduction();

    // Flag conflicting tolerances if applicable
    const tiltTolFlag = '<div class="saas-eng-flag">Engineering note: Avans Assembly Guide states ±10° E/W slope tolerance, while the 8.0 / 10.0 datasheet shows ±1°. Resolve before publishing project drawings.</div>';

    body.innerHTML = `
      <div class="saas-eng-block">
        <div class="saas-eng-block-head">
          <div class="saas-eng-block-title">Wind uplift pressure</div>
          <div class="saas-eng-block-result">${wind.p_uplift.toFixed(1)} psf</div>
        </div>
        <div class="saas-eng-formula">qz = 0.00256 × <em>Kz</em> × <em>Kzt</em> × <em>Kd</em> × <em>Ke</em> × <em>V²</em>
   = 0.00256 × ${wind.Kz.toFixed(3)} × ${wind.Kzt.toFixed(2)} × ${wind.Kd} × ${wind.Ke.toFixed(2)} × ${wind.V}²
   = <b>${wind.qz.toFixed(2)} psf</b> (velocity pressure)

p = qz × G × |GCp - GCpi|
  = ${wind.qz.toFixed(2)} × ${wind.G} × (1.6 + 0.18)
  = <b>${wind.p_uplift.toFixed(1)} psf</b> (design uplift)</div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Basic wind speed V</span>
          <span class="saas-eng-step-val">${wind.V} mph</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Exposure</span>
          <span class="saas-eng-step-val">${wind.exp}</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Kz at z = ${wind.z} ft</span>
          <span class="saas-eng-step-val">${wind.Kz.toFixed(3)}</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Topographic Kzt</span>
          <span class="saas-eng-step-val">${wind.Kzt.toFixed(2)}</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Directionality Kd</span>
          <span class="saas-eng-step-val">${wind.Kd}</span>
        </div>
        <div class="saas-eng-cite">ASCE 7-22 §26.10 (velocity pressure) · §30 (components &amp; cladding)</div>
      </div>

      <div class="saas-eng-block">
        <div class="saas-eng-block-head">
          <div class="saas-eng-block-title">Snow load on collector</div>
          <div class="saas-eng-block-result">${snow.ps.toFixed(1)} psf</div>
        </div>
        <div class="saas-eng-formula">pf = 0.7 × <em>Ce</em> × <em>Ct</em> × <em>Is</em> × <em>pg</em>
   = 0.7 × ${snow.Ce} × ${snow.Ct} × ${snow.Is} × ${snow.pg}
   = <b>${snow.pf.toFixed(2)} psf</b> (flat roof snow)

ps = <em>Cs</em> × pf
   = ${snow.Cs} × ${snow.pf.toFixed(2)}
   = <b>${snow.ps.toFixed(1)} psf</b> (sloped collector)</div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Ground snow pg</span>
          <span class="saas-eng-step-val">${snow.pg} psf</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Ct (heated frame) · solar</span>
          <span class="saas-eng-step-val">${snow.Ct} (cold roof)</span>
        </div>
        <div class="saas-eng-cite">ASCE 7-22 §7.3 (snow loads on roofs &amp; structures)</div>
      </div>

      <div class="saas-eng-block">
        <div class="saas-eng-block-head">
          <div class="saas-eng-block-title">Seismic horizontal force</div>
          <div class="saas-eng-block-result">${(seism.fpw * 100).toFixed(1)}% W</div>
        </div>
        <div class="saas-eng-formula">Fp/Wp = 0.4 × <em>ap</em> × <em>S_DS</em> × (1 + 2·z/h) × <em>Ip</em> / <em>Rp</em>
       = 0.4 × ${seism.ap} × ${seism.SDS.toFixed(2)} × (1 + 2·${seism.z_h}) × ${seism.Ip} / ${seism.Rp}
       = <b>${seism.fpw.toFixed(3)}</b>  (= ${(seism.fpw * 100).toFixed(1)}% of self-weight)</div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">SDS (design spectral accel)</span>
          <span class="saas-eng-step-val">${seism.SDS.toFixed(2)} g</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Seismic Design Cat</span>
          <span class="saas-eng-step-val">${seism.cat}</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Component Rp / ap</span>
          <span class="saas-eng-step-val">${seism.Rp} / ${seism.ap}</span>
        </div>
        <div class="saas-eng-cite">ASCE 7-22 §13.3.1 (nonstructural components)</div>
      </div>

      <div class="saas-eng-block">
        <div class="saas-eng-block-head">
          <div class="saas-eng-block-title">Year-1 production</div>
          <div class="saas-eng-block-result">${kwhFmt(prod.kwhYear)}</div>
        </div>
        <div class="saas-eng-formula">E = kW_DC × <em>I</em> × 365 × <em>η_temp</em> × (1 - <em>L</em>) × <em>η_inv</em>
  = ${prod.kwDC.toFixed(1)} × ${prod.irr} × 365 × ${prod.tempCoeff} × (1 - ${prod.totalLoss.toFixed(3)}) × ${prod.inverterEff}
  = <b>${kwhFmt(prod.kwhYear)}/yr</b></div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Site irradiance I</span>
          <span class="saas-eng-step-val">${prod.irr} kWh/m²/day</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Capacity factor</span>
          <span class="saas-eng-step-val">${(prod.cf * 100).toFixed(1)}%</span>
        </div>
        <div class="saas-eng-step">
          <span class="saas-eng-step-label">Total system losses</span>
          <span class="saas-eng-step-val">${(prod.totalLoss * 100).toFixed(1)}%</span>
        </div>
        ${prod.zip ? `<div class="saas-eng-step"><span class="saas-eng-step-label">ZIP detected</span><span class="saas-eng-step-val">${prod.zip}</span></div>` : ''}
        <div class="saas-eng-cite">PVWatts-style model (NREL TMY3 statewide averages)</div>
      </div>

      ${tiltTolFlag}
    `;
  }

  function kwhFmt(v) {
    if (v >= 1e9) return (v / 1e9).toFixed(2) + ' TWh';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + ' GWh';
    if (v >= 1e3) return Math.round(v / 1e3).toLocaleString() + ' MWh';
    return Math.round(v).toLocaleString() + ' kWh';
  }

  /* ────────────────────────────────────────────────────────────────────────
     PRODUCTION + COST CARDS · injected after card-summary

  function buildIntelCards() {
    const summary = document.getElementById('card-summary');
    if (!summary) return;
    if (document.getElementById('saas-intel-grid')) return;

    const grid = document.createElement('div');
    grid.id = 'saas-intel-grid';
    grid.className = 'saas-intel-grid';
    grid.innerHTML = `
      <div class="saas-intel-card" id="saas-intel-prod">
        <div class="saas-intel-eyebrow">Year-1 production</div>
        <div class="saas-intel-big" id="saas-intel-prod-big">—</div>
        <div class="saas-intel-sub" id="saas-intel-prod-sub">awaiting layout</div>
        <div style="margin-top:14px" id="saas-intel-prod-rows"></div>
      </div>
      <div class="saas-intel-card" id="saas-intel-cost">
        <div class="saas-intel-eyebrow">Project cost (rough)</div>
        <div class="saas-intel-toggle">
          <button data-mode="total" class="active">Total</button>
          <button data-mode="perW">$/W</button>
        </div>
        <div class="saas-intel-big" id="saas-intel-cost-big">—</div>
        <div class="saas-intel-sub" id="saas-intel-cost-sub">enter system size</div>
        <div class="saas-intel-cat-bar" id="saas-intel-cost-bar"></div>
        <div class="saas-intel-cat-legend" id="saas-intel-cost-legend"></div>
      </div>
    `;
    // Append it inside the summary card body if available, else after the card.
    const body = summary.querySelector('.cfg-card-body') || summary;
    body.appendChild(grid);

    // Toggle handlers
    let costMode = 'total';
    grid.querySelectorAll('.saas-intel-toggle button').forEach(b => {
      b.addEventListener('click', () => {
        costMode = b.dataset.mode;
        grid.querySelectorAll('.saas-intel-toggle button').forEach(x => x.classList.toggle('active', x === b));
        renderCost(costMode);
      });
    });

    SAAS.intel = {
      refresh() {
        renderProd();
        renderCost(costMode);
      }
    };
  }

  function renderProd() {
    const big = document.getElementById('saas-intel-prod-big');
    const sub = document.getElementById('saas-intel-prod-sub');
    const rows = document.getElementById('saas-intel-prod-rows');
    if (!big) return;
    const p = computeProduction();
    if (p.kwDC <= 0) {
      big.textContent = '—';
      sub.textContent = 'add sections to see production';
      rows.innerHTML = '';
      return;
    }
    big.textContent = kwhFmt(p.kwhYear) + '/yr';
    sub.textContent = `${p.kwDC.toFixed(1)} kW DC · capacity factor ${(p.cf * 100).toFixed(1)}%`;
    const valueFmt = '$' + Math.round(p.valueYr).toLocaleString();
    rows.innerHTML = `
      <div class="saas-intel-row"><span class="saas-intel-row-label">Site irradiance</span><span class="saas-intel-row-val">${p.irr} kWh/m²/day</span></div>
      <div class="saas-intel-row"><span class="saas-intel-row-label">DC/AC ratio</span><span class="saas-intel-row-val">${p.dcAcRatio.toFixed(2)}</span></div>
      <div class="saas-intel-row"><span class="saas-intel-row-label">System losses</span><span class="saas-intel-row-val">${(p.totalLoss * 100).toFixed(1)}%</span></div>
      <div class="saas-intel-row"><span class="saas-intel-row-label">Year-1 revenue @ $0.10</span><span class="saas-intel-row-val">${valueFmt}</span></div>
    `;
  }

  function renderCost(mode) {
    const big = document.getElementById('saas-intel-cost-big');
    const sub = document.getElementById('saas-intel-cost-sub');
    const bar = document.getElementById('saas-intel-cost-bar');
    const leg = document.getElementById('saas-intel-cost-legend');
    if (!big) return;
    const c = computeCost();
    if (c.kwDC <= 0) {
      big.textContent = '—';
      sub.textContent = 'add sections to estimate';
      bar.innerHTML = '';
      leg.innerHTML = '';
      return;
    }
    if (mode === 'perW') {
      big.textContent = '$' + c.totalPerW.toFixed(2) + '/W';
      sub.textContent = 'turnkey installed · USD';
    } else {
      const tot = c.total >= 1e6
        ? '$' + (c.total / 1e6).toFixed(2) + 'M'
        : '$' + Math.round(c.total).toLocaleString();
      big.textContent = tot;
      sub.textContent = '$' + c.totalPerW.toFixed(2) + '/W · ' + c.kwDC.toFixed(1) + ' kW DC';
    }
    // Bar
    bar.innerHTML = c.lines.map(l => {
      const pct = c.total > 0 ? (l.cost / c.total) * 100 : 0;
      return `<span class="saas-intel-cat-seg" style="width:${pct.toFixed(2)}%;background:${l.color}" title="${l.label}: ${pct.toFixed(1)}%"></span>`;
    }).join('');
    // Legend
    leg.innerHTML = c.lines.map(l => {
      const dollars = mode === 'perW' ? '$' + l.perW.toFixed(2) + '/W' : '$' + Math.round(l.cost).toLocaleString();
      return `<div class="saas-intel-cat-leg-item">
        <span class="saas-intel-cat-leg-dot" style="background:${l.color}"></span>
        <span style="flex:1">${l.label}</span>
        <span style="font-weight:800;color:var(--gray-700)">${dollars}</span>
      </div>`;
    }).join('');
  }

  function attachZipChip() {
    const addr = document.getElementById('siteAddress');
    if (!addr) return;
    if (document.getElementById('saas-zip-chip')) return;

    const chip = document.createElement('button');
    chip.id = 'saas-zip-chip';
    chip.className = 'saas-zip-chip';
    chip.type = 'button';
    chip.textContent = 'Auto-fill from ZIP';
    chip.style.display = 'none';
    addr.parentNode.appendChild(chip);

    chip.addEventListener('click', () => openZipPopover(chip, addr.value));

    function update() {
      const z = findZipInString(addr.value);
      const data = z ? lookupZip(z) : null;
      if (data) {
        chip.style.display = 'inline-flex';
        chip.textContent = `Auto-fill defaults · ${data.state} ${z}`;
      } else {
        chip.style.display = 'none';
      }
    }
    addr.addEventListener('input', update);
    update();
  }

  function openZipPopover(anchor, addrText) {
    closeZipPopover();
    const z = findZipInString(addrText);
    if (!z) return;
    const data = lookupZip(z);
    if (!data) return;

    const pop = document.createElement('div');
    pop.className = 'saas-zip-popover';
    pop.id = 'saas-zip-popover';
    pop.innerHTML = `
      <h4>${data.state} · ${data.zip}</h4>
      <p>${data.descr}</p>
      <div class="saas-zip-list">
        <div class="saas-zip-item"><span class="saas-zip-item-key">Wind speed (V)</span><span class="saas-zip-item-val">${data.wind} mph</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">Exposure</span><span class="saas-zip-item-val">${data.exp}</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">Ground snow load</span><span class="saas-zip-item-val">${data.snow} psf</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">Frost depth</span><span class="saas-zip-item-val">${data.frost}"</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">SDS</span><span class="saas-zip-item-val">${data.sds.toFixed(2)} g</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">Seismic Cat</span><span class="saas-zip-item-val">${data.seismic}</span></div>
        <div class="saas-zip-item"><span class="saas-zip-item-key">Avg irradiance</span><span class="saas-zip-item-val">${data.irr} kWh/m²/day</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="saas-btn saas-btn-ghost" id="saas-zip-cancel">Cancel</button>
        <button class="saas-btn saas-btn-pri" id="saas-zip-apply" style="flex:1">Apply all 7 defaults</button>
      </div>
    `;
    document.body.appendChild(pop);

    // Position next to anchor
    const r = anchor.getBoundingClientRect();
    let left = r.left;
    let top = r.bottom + window.scrollY + 8;
    pop.style.left = Math.min(left, window.innerWidth - 400) + 'px';
    pop.style.top = top + 'px';

    document.getElementById('saas-zip-apply').addEventListener('click', () => {
      // Capture undo first
      if (window.SAAS && SAAS.undo && typeof SAAS.undo._captureUndo === 'function') SAAS.undo._captureUndo();
      setVal('windSpeed', data.wind);
      setVal('exposureCat', data.exp);
      setVal('snowLoad', data.snow);
      setVal('frostDepth', data.frost);
      setVal('sds', data.sds);
      setVal('seismicCat', data.seismic);
      // Trigger change events so host recalcs
      ['windSpeed','exposureCat','snowLoad','frostDepth','sds','seismicCat'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.dispatchEvent(new Event('change', { bubbles: true }));
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });
      if (typeof window.recalcAll === 'function') window.recalcAll();
      if (typeof window.toast === 'function') window.toast(`Applied ${data.state} defaults`);
      if (SAAS.intel) SAAS.intel.refresh();
      if (SAAS.engcon) SAAS.engcon.refresh();
      closeZipPopover();
    });
    document.getElementById('saas-zip-cancel').addEventListener('click', closeZipPopover);

    setTimeout(() => document.addEventListener('click', outsideClose), 50);
    function outsideClose(e) {
      if (!pop.contains(e.target) && e.target !== anchor) {
        closeZipPopover();
        document.removeEventListener('click', outsideClose);
      }
    }
  }
  function closeZipPopover() {
    const old = document.getElementById('saas-zip-popover');
    if (old) old.remove();
  }
  function setVal(id, v) {
    const el = document.getElementById(id);
    if (!el || v === undefined || v === null) return;
    el.value = v;
  }

  /* ────────────────────────────────────────────────────────────────────────
     WIRE-UP · refresh on changes, hook into Phase 1+2 events
     ──────────────────────────────────────────────────────────────────────── */
  function init() {
    buildEngConsole();
    buildIntelCards();
    attachZipChip();

    // Hook into form changes to refresh the live engineering console & cost.
    let t = null;
    document.addEventListener('input', e => {
      if (!e.target.matches('input, select, textarea')) return;
      clearTimeout(t);
      t = setTimeout(() => {
        if (SAAS.engcon && document.getElementById('saas-engcon')?.classList.contains('show')) {
          SAAS.engcon.refresh();
        }
        if (SAAS.intel) SAAS.intel.refresh();
      }, 200);
    });

    // Refresh whenever the canvas re-renders (wraps the host's renderCanvas)
    if (typeof window.renderCanvas === 'function') {
      const orig = window.renderCanvas;
      window.renderCanvas = function () {
        const r = orig.apply(this, arguments);
        if (SAAS.intel) SAAS.intel.refresh();
        if (SAAS.engcon && document.getElementById('saas-engcon')?.classList.contains('show')) SAAS.engcon.refresh();
        return r;
      };
    }

    // Initial refresh
    setTimeout(() => {
      if (SAAS.intel) SAAS.intel.refresh();
    }, 100);

    console.log('[SEMS SaaS Layer] Phase 3 (Intelligence) ready.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 120));
  } else {
    setTimeout(init, 120);
  }

  // Expose helpers for Phase 4+ extensibility
  SAAS.zip = { lookupZip, findZipInString, STATE_CLIMATE };
  SAAS.compute = { computeWindPressure, computeSnowLoad, computeSeismic, computeProduction, computeCost };
})();
</script>
