<script>
/* ══════════════════════════════════════════════════════════════════════════
   SAAS PHASE 4 ENGINE · Visualization
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  if (!window.SAAS) {
    console.warn('[SAAS Phase 4] window.SAAS not found — Phase 1+2+3 layers must load first.');
    return;
  }

  const _getLayout = new Function('return typeof layoutState!=="undefined"?layoutState:[];');
  function host_layout() { return _getLayout() || []; }

  /* ────────────────────────────────────────────────────────────────────────
     INLINED SUNCALC · Vladimir Agafonkin (BSD-2)
     Just enough for sun position (azimuth + altitude) given date, lat, lng
     ──────────────────────────────────────────────────────────────────────── */
  const PI = Math.PI;
  const rad = PI / 180;
  const dayMs = 1000 * 60 * 60 * 24;
  const J1970 = 2440588;
  const J2000 = 2451545;
  const e = rad * 23.4397; // obliquity of Earth

  function toJulian(date) { return date.valueOf() / dayMs - 0.5 + J1970; }
  function toDays(date) { return toJulian(date) - J2000; }
  function rightAscension(l, b) {
    return Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
  }
  function declination(l, b) {
    return Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
  }
  function azimuth(H, phi, dec) {
    return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  }
  function altitude(H, phi, dec) {
    return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  }
  function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }
  function solarMeanAnomaly(d) { return rad * (357.5291 + 0.98560028 * d); }
  function eclipticLongitude(M) {
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const P = rad * 102.9372;
    return M + C + P + PI;
  }
  function sunCoords(d) {
    const M = solarMeanAnomaly(d);
    const L = eclipticLongitude(M);
    return { dec: declination(L, 0), ra: rightAscension(L, 0) };
  }
  function getSunPosition(date, lat, lng) {
    const lw = rad * -lng;
    const phi = rad * lat;
    const d = toDays(date);
    const c = sunCoords(d);
    const H = siderealTime(d, lw) - c.ra;
    return { azimuth: azimuth(H, phi, c.dec), altitude: altitude(H, phi, c.dec) };
  }

  /* ────────────────────────────────────────────────────────────────────────
     STATE LAT/LNG · approx geographic centroid for each US state
     ──────────────────────────────────────────────────────────────────────── */
  const STATE_LAT_LNG = {
    AK: [64.0, -150.0], AL: [33.0, -86.8], AR: [34.7, -92.4], AZ: [34.0, -111.5],
    CA: [37.3, -119.4], CO: [39.0, -105.5], CT: [41.6, -72.7], DC: [38.9, -77.0],
    DE: [39.0, -75.5], FL: [28.0, -81.5],  GA: [33.0, -83.5], HI: [20.8, -156.3],
    IA: [42.0, -93.5],  ID: [44.4, -114.0], IL: [40.0, -89.0], IN: [40.0, -86.3],
    KS: [38.5, -98.4],  KY: [37.8, -84.7], LA: [31.0, -91.8], MA: [42.3, -71.8],
    MD: [39.0, -76.7],  ME: [45.4, -69.0], MI: [44.3, -85.4], MN: [46.0, -94.6],
    MO: [38.5, -92.5],  MS: [33.0, -89.7], MT: [47.0, -110.0], NC: [35.5, -79.4],
    ND: [47.5, -100.5], NE: [41.5, -99.8], NH: [43.7, -71.6], NJ: [40.2, -74.7],
    NM: [34.5, -106.0], NV: [39.3, -117.0], NY: [42.9, -75.5], OH: [40.4, -82.8],
    OK: [35.5, -97.5],  OR: [44.0, -120.5], PA: [41.0, -77.7], PR: [18.2, -66.4],
    RI: [41.6, -71.5],  SC: [33.9, -80.9], SD: [44.5, -100.2], TN: [36.0, -86.7],
    TX: [31.0, -99.0],  UT: [39.4, -111.6], VA: [37.5, -78.9], VT: [44.0, -72.7],
    WA: [47.4, -120.4], WI: [44.5, -89.8], WV: [38.5, -80.6], WY: [43.0, -107.5]
  };

  function findLatLng() {
    // Try the user's site address ZIP
    if (window.SAAS?.zip) {
      const addrField = document.getElementById('siteAddress');
      const addr = (addrField?.value || '') + ' ' + (document.getElementById('siteName')?.value || '');
      const zip = SAAS.zip.findZipInString(addr);
      if (zip) {
        const data = SAAS.zip.lookupZip(zip);
        if (data && STATE_LAT_LNG[data.state]) {
          return { lat: STATE_LAT_LNG[data.state][0], lng: STATE_LAT_LNG[data.state][1], source: data.state, zip };
        }
      }
    }
    // Fallback: PA (the SEMS HQ)
    return { lat: 41.4, lng: -75.66, source: 'Scranton, PA (default)', zip: null };
  }

  /* ────────────────────────────────────────────────────────────────────────
     SECTION METRICS · per-section data for heatmap and 3D
     ──────────────────────────────────────────────────────────────────────── */
  function getPanel() {
    return {
      width: parseFloat(document.getElementById('panelWidth')?.value) || 41.3,
      length: parseFloat(document.getElementById('panelLength')?.value) || 74.8,
      wattage: parseFloat(document.getElementById('panelWattage')?.value) || 430
    };
  }
  function getSpacing() {
    return {
      tilt: parseFloat(document.getElementById('tiltAngle')?.value) || 25,
      groundClearance: parseFloat(document.getElementById('groundClearance')?.value) || 24,
      rowSpacing: parseFloat(document.getElementById('rowSpacing')?.value) || 6,
      sectionSpacing: parseFloat(document.getElementById('sectionSpacing')?.value) || 60,
      layoutRowGap: parseFloat(document.getElementById('layoutRowGap')?.value) || 120
    };
  }

  // Per-section metric calculator
  // Wind load uses ASCE 7-22 zone factors: corner sections see ~1.5x, edge ~1.2x, interior 1.0x
  function getSectionMetrics() {
    const panel = getPanel();
    const layout = host_layout();
    const totalRows = layout.length;

    // First compute aggregate kW for cost calculation
    let totalKw = 0;
    layout.forEach(row => {
      (row.sections || []).forEach(sec => {
        const c = window.getSectionModuleCount(sec.type, panel.width);
        totalKw += (c.modules * panel.wattage) / 1000;
      });
    });

    let totalCost = 0;
    if (window.SAAS?.compute?.computeCost) {
      try { totalCost = SAAS.compute.computeCost().total; } catch {}
    }
    if (totalCost === 0) totalCost = totalKw * 1000 * 0.95; // fallback ~$0.95/W

    const result = [];
    layout.forEach((row, ri) => {
      const sections = row.sections || [];
      const totalSecs = sections.length;
      sections.forEach((sec, si) => {
        const c = window.getSectionModuleCount(sec.type, panel.width);
        const kw = (c.modules * panel.wattage) / 1000;
        const isFirstRow = ri === 0;
        const isLastRow = ri === totalRows - 1;
        const isFirstSec = si === 0;
        const isLastSec = si === totalSecs - 1;
        const isCorner = (isFirstRow || isLastRow) && (isFirstSec || isLastSec);
        const isEdge = !isCorner && (isFirstRow || isLastRow || isFirstSec || isLastSec);
        const windFactor = isCorner ? 1.5 : (isEdge ? 1.2 : 1.0);
        const cost = totalKw > 0 ? (kw / totalKw) * totalCost : 0;
        result.push({
          id: sec.id, type: sec.type, rowIdx: ri, secIdx: si,
          modules: c.modules, panelsPerRow: c.panelsPerRow,
          kw, cost, windFactor,
          position: isCorner ? 'corner' : (isEdge ? 'edge' : 'interior')
        });
      });
    });
    return { sections: result, totalKw, totalCost };
  }

  /* ────────────────────────────────────────────────────────────────────────
     HEATMAP OVERLAY · color the existing 2D canvas sections
     ──────────────────────────────────────────────────────────────────────── */
  const HEATMAP_MODES = [
    { id: 'none', label: 'No heatmap', unit: '' },
    { id: 'kw',   label: 'DC kW per section', unit: ' kW DC', low: [220, 235, 248], high: [27, 58, 92] },
    { id: 'pan',  label: 'Panel count', unit: ' panels', low: [232, 240, 250], high: [38, 96, 164] },
    { id: 'cost', label: 'Section cost ($)', unit: '', low: [255, 245, 230], high: [180, 60, 12] },
    { id: 'wind', label: 'Wind load factor', unit: 'x', low: [232, 245, 232], high: [180, 50, 50] }
  ];

  let currentHeatMode = 'none';

  function buildHeatToolbar() {
    const card = document.getElementById('card-builder');
    if (!card) return;
    const head = card.querySelector('.cfg-card-head');
    if (!head || head.querySelector('.saas-heat-bar')) return;

    const bar = document.createElement('div');
    bar.className = 'saas-heat-bar';
    bar.innerHTML = `
      <span class="saas-heat-label">Color by</span>
      <select class="saas-heat-select" id="saas-heat-mode">
        ${HEATMAP_MODES.map(m => `<option value="${m.id}">${m.label}</option>`).join('')}
      </select>
      <button class="saas-heat-3dbtn" id="saas-heat-3dbtn">Open in 3D</button>
    `;
    head.appendChild(bar);

    document.getElementById('saas-heat-mode').addEventListener('change', e => {
      currentHeatMode = e.target.value;
      applyHeatmap();
    });
    document.getElementById('saas-heat-3dbtn').addEventListener('click', () => SAAS.viz3d.open());
  }

  function lerpColor(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function applyHeatmap() {
    const canvas = document.getElementById('canvas');
    if (!canvas) return;

    // Remove any prior legend
    const oldLegend = document.getElementById('saas-heat-legend');
    if (oldLegend) oldLegend.remove();

    const mode = HEATMAP_MODES.find(m => m.id === currentHeatMode);
    if (!mode || mode.id === 'none') {
      // Reset
      canvas.querySelectorAll('.sec-block').forEach(el => {
        el.style.background = '';
        el.style.color = '';
      });
      return;
    }

    const { sections } = getSectionMetrics();
    if (!sections.length) return;

    // Build value map
    const valueMap = {};
    sections.forEach(s => {
      let v = 0;
      if (mode.id === 'kw') v = s.kw;
      else if (mode.id === 'pan') v = s.modules;
      else if (mode.id === 'cost') v = s.cost;
      else if (mode.id === 'wind') v = s.windFactor;
      valueMap[s.id] = v;
    });

    const values = Object.values(valueMap);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min = min * 0.9; max = max * 1.1 + 1; }

    // Apply colors
    canvas.querySelectorAll('.sec-block').forEach(el => {
      const id = el.dataset.secid;
      const v = valueMap[id];
      if (v === undefined) return;
      const t = (v - min) / (max - min);
      const c = lerpColor(mode.low, mode.high, t);
      el.style.background = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
      // Adjust text color for legibility
      const luminance = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
      el.style.color = luminance > 0.6 ? 'var(--gray-900)' : 'white';
    });

    // Legend
    const legend = document.createElement('div');
    legend.className = 'saas-heat-legend';
    legend.id = 'saas-heat-legend';
    const fmt = v => mode.id === 'cost'
      ? '$' + Math.round(v).toLocaleString()
      : (mode.id === 'wind' ? v.toFixed(1) : Math.round(v * 10) / 10);
    legend.innerHTML = `
      <span class="saas-heat-legend-label">${mode.label}</span>
      <span class="saas-heat-legend-min">${fmt(min)}${mode.unit}</span>
      <div class="saas-heat-legend-bar" style="background:linear-gradient(90deg,
        rgb(${mode.low.join(',')}),
        rgb(${mode.high.join(',')}))"></div>
      <span class="saas-heat-legend-max">${fmt(max)}${mode.unit}</span>
    `;
    canvas.parentNode.insertBefore(legend, canvas);
  }

  /* ────────────────────────────────────────────────────────────────────────
     THREE.JS LOADER (lazy, on demand)
     ──────────────────────────────────────────────────────────────────────── */
  function loadThree() {
    return new Promise((resolve, reject) => {
      if (window.THREE) return resolve(window.THREE);
      const existing = document.querySelector('script[data-saas-three]');
      if (existing) {
        existing.addEventListener('load', () => resolve(window.THREE));
        existing.addEventListener('error', reject);
        return;
      }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s.dataset.saasThree = '1';
      s.onload = () => resolve(window.THREE);
      s.onerror = () => reject(new Error('Failed to load Three.js'));
      document.head.appendChild(s);
    });
  }

  /* ────────────────────────────────────────────────────────────────────────
     3D SCENE BUILDER
     Coordinate convention: +X = east, +Y = up, +Z = south
     Units: 1 Three.js unit = 1 inch (we scale at render time for camera)
     ──────────────────────────────────────────────────────────────────────── */
  let scene, camera, renderer, sunLight, ambientLight, sunMesh, sunArcLine, gridHelper;
  let frame = null, dirty = true;
  let cameraTheta = 0.6, cameraPhi = 0.85, cameraDist = 1500;
  let cameraTarget = { x: 0, y: 0, z: 0 };

  function buildScene(THREE) {
    const wrap = document.getElementById('saas-3d-canvas-wrap');
    wrap.querySelector('canvas')?.remove();
    wrap.querySelector('.saas-3d-empty')?.remove();

    const layout = host_layout();
    if (!layout.length || !layout.some(r => r.sections?.length)) {
      const empty = document.createElement('div');
      empty.className = 'saas-3d-empty';
      empty.innerHTML = `<strong>No sections to render yet</strong>
        Add sections to the 2D builder, then come back here.<br>
        Tip: ⌘K → "Generate 250 kW system"`;
      wrap.appendChild(empty);
      document.getElementById('saas-3d-loading').style.display = 'none';
      return false;
    }

    const W = wrap.clientWidth, H = wrap.clientHeight;
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a1828, 1500, 6000);

    camera = new THREE.PerspectiveCamera(40, W / H, 1, 8000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);
    wrap.appendChild(renderer.domElement);
    document.getElementById('saas-3d-loading').style.display = 'none';

    // Lighting
    ambientLight = new THREE.AmbientLight(0x4a6b8a, 0.55);
    scene.add(ambientLight);

    sunLight = new THREE.DirectionalLight(0xfff2d4, 1.1);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left = -2000;
    sunLight.shadow.camera.right = 2000;
    sunLight.shadow.camera.top = 2000;
    sunLight.shadow.camera.bottom = -2000;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 5000;
    sunLight.shadow.bias = -0.0008;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // Sun mesh (just visual)
    const sunGeom = new THREE.SphereGeometry(40, 16, 16);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFD37A });
    sunMesh = new THREE.Mesh(sunGeom, sunMat);
    scene.add(sunMesh);

    // Ground
    const groundGeom = new THREE.PlaneGeometry(8000, 8000);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x3a4a5a,
      roughness: 0.95,
      metalness: 0
    });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper (toggleable)
    gridHelper = new THREE.GridHelper(4000, 40, 0x5BBCE4, 0x2a4a6a);
    gridHelper.position.y = 0.5;
    gridHelper.material.opacity = 0.15;
    gridHelper.material.transparent = true;
    gridHelper.visible = false;
    scene.add(gridHelper);

    // Build the array
    const panel = getPanel();
    const sp = getSpacing();
    const tilt = sp.tilt * Math.PI / 180;

    const moduleW = panel.width;        // along the rail (X direction)
    const moduleL = panel.length;       // across the rail (Z direction, slope length)
    const gc = sp.groundClearance;
    const sectionGap = sp.sectionSpacing;
    const rowGap = sp.layoutRowGap;

    // Materials (cached)
    const panelMat = new THREE.MeshStandardMaterial({
      color: 0x1B3A5C, metalness: 0.3, roughness: 0.4,
    });
    const panelEdgeMat = new THREE.LineBasicMaterial({ color: 0x5BBCE4, linewidth: 1 });
    const postMat = new THREE.MeshStandardMaterial({
      color: 0x9CA3B0, metalness: 0.6, roughness: 0.5
    });
    const beamMat = new THREE.MeshStandardMaterial({
      color: 0xB8C0CC, metalness: 0.7, roughness: 0.45
    });

    // SEMS GEOMETRY · same-direction continuous tilt.
    //
    // Both rows of a section tilt the same direction (south-facing in northern
    // hemisphere). The NORTH edge of the lower (south) row meets the SOUTH edge
    // of the upper (north) row at a shared "join line" — the structural rail.
    // This forms ONE continuous tilted plane, not two separate panel groups.
    //
    // POSTS: exactly one post per side of each section, standing under the
    // join line. Adjacent sections share their boundary post — so a row of N
    // sections needs N+1 posts, not 4N.
    //
    // We build everything around a "pivot" — the (x, y, z) point where the
    // join line crosses the section boundary.
    //   pivotY = gc + moduleL * sin(tilt)       (height of join above ground)
    //   pivotZ = section's N-S center (z = 0 in section-local coords)
    // Module centers sit at ±halfDist along the tilted plane from the pivot.

    const halfDist = moduleL / 2;
    const pivotY   = gc + moduleL * Math.sin(tilt);
    const sectionDepth = 2 * moduleL * Math.cos(tilt); // N-S ground projection

    // Compute layout row depths along X for centering
    const rowDepths = [];
    layout.forEach(row => {
      const sections = row.sections || [];
      let rowSpan = 0;
      sections.forEach((sec, i) => {
        const ppr = window.getSectionModuleCount(sec.type, panel.width).panelsPerRow;
        const sectionWidth = ppr * moduleW;
        rowSpan += sectionWidth;
        if (i < sections.length - 1) rowSpan += sectionGap;
      });
      rowDepths.push(rowSpan);
    });
    const maxRowSpan = Math.max(...rowDepths, 1);
    const rowDepthSize = sectionDepth;
    const totalDepth = layout.length * rowDepthSize + (layout.length - 1) * rowGap;
    const offsetZ = -totalDepth / 2 + rowDepthSize / 2;

    layout.forEach((row, ri) => {
      const sections = row.sections || [];
      if (!sections.length) return;
      const totalRowWidth = rowDepths[ri];
      let xCursor = -totalRowWidth / 2;
      const zCenter = offsetZ + ri * (rowDepthSize + rowGap); // pivotZ for this layout row

      // X positions of section boundaries → posts (Set dedupes shared posts).
      const postXs = new Set();

      sections.forEach((sec, si) => {
        const c = window.getSectionModuleCount(sec.type, panel.width);
        const ppr = c.panelsPerRow;
        const sectionWidth = ppr * moduleW;

        // Build the section: one continuous tilted plane composed of two
        // module rows. Row 0 (south, lower) sits south of the pivot; row 1
        // (north, upper) sits north. Both tilt the same direction.
        for (let rowIdx = 0; rowIdx < 2; rowIdx++) {
          // sign: +1 for south row (panel center on +Z side), -1 for north row.
          const sign = rowIdx === 0 ? +1 : -1;
          // Module center, relative to pivot, along the tilted plane:
          //   - South row: lower & south of pivot
          //   - North row: higher & north of pivot
          const cy = pivotY - sign * halfDist * Math.sin(tilt);
          const dz = sign * halfDist * Math.cos(tilt);

          for (let p = 0; p < ppr; p++) {
            const panelGeom = new THREE.BoxGeometry(moduleW * 0.97, 1.2, moduleL * 0.985);
            const m = new THREE.Mesh(panelGeom, panelMat);
            m.castShadow = true;
            m.receiveShadow = true;

            const px = xCursor + p * moduleW + moduleW / 2;
            m.position.set(px, cy, zCenter + dz);
            // rotation.x = +tilt makes south edge (+Z) go DOWN and north edge
            // (-Z) go UP — proper south-facing tilt for northern hemisphere.
            m.rotation.x = +tilt;
            scene.add(m);

            const edges = new THREE.EdgesGeometry(panelGeom);
            const line = new THREE.LineSegments(edges, panelEdgeMat);
            line.position.copy(m.position);
            line.rotation.copy(m.rotation);
            scene.add(line);
          }
        }

        // Continuous structural rail visible across this section's join line,
        // running E-W at pivot height. This is the bearing rail / W-beam where
        // both module rows meet and where the post(s) attach.
        const railBeam = new THREE.Mesh(
          new THREE.BoxGeometry(sectionWidth, 2.5, 4),
          beamMat
        );
        railBeam.position.set(xCursor + sectionWidth / 2, pivotY - 1.5, zCenter);
        railBeam.castShadow = true;
        scene.add(railBeam);

        // Register this section's left & right post positions.
        // Adjacent sections share the boundary X → Set dedupes.
        postXs.add(Math.round(xCursor * 1000) / 1000);
        postXs.add(Math.round((xCursor + sectionWidth) * 1000) / 1000);

        xCursor += sectionWidth + sectionGap;
      });

      // Render one post per unique x-position, at the join line (z = zCenter).
      // Each post stands from ground to just under the rail.
      const postR = 3.0;
      const postH = pivotY - 2;
      postXs.forEach(x => {
        const post = new THREE.Mesh(
          new THREE.BoxGeometry(postR * 2, postH, postR * 2),
          postMat
        );
        post.position.set(x, postH / 2, zCenter);
        post.castShadow = true;
        post.receiveShadow = true;
        scene.add(post);
      });
    });

    // Sun arc placeholder (built dynamically)
    sunArcLine = null;

    // Set initial camera target to center of array, near the array height
    cameraTarget = { x: 0, y: pivotY * 0.7, z: 0 };
    cameraDist = Math.max(800, totalDepth * 1.4 + maxRowSpan * 0.7);

    bindOrbitControls(wrap);
    return true;
  }

  function bindOrbitControls(wrap) {
    const canvas = wrap.querySelector('canvas');
    if (!canvas) return;
    let dragging = false, panning = false, lx = 0, ly = 0;

    canvas.addEventListener('mousedown', e => {
      dragging = true;
      panning = e.shiftKey;
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('mouseup', () => { dragging = false; panning = false; });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - lx;
      const dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      if (panning) {
        cameraTarget.x -= dx * cameraDist * 0.0008;
        cameraTarget.z -= dy * cameraDist * 0.0008;
      } else {
        cameraTheta -= dx * 0.008;
        cameraPhi += dy * 0.008;
        cameraPhi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPhi));
      }
      dirty = true;
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      cameraDist *= (1 + Math.sign(e.deltaY) * 0.08);
      cameraDist = Math.max(200, Math.min(8000, cameraDist));
      dirty = true;
    }, { passive: false });

    // Touch support
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, mode: 'orbit' };
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStart = { dist: Math.sqrt(dx*dx + dy*dy), mode: 'pinch' };
      }
    });
    canvas.addEventListener('touchmove', e => {
      if (!touchStart) return;
      e.preventDefault();
      if (touchStart.mode === 'orbit' && e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStart.x;
        const dy = e.touches[0].clientY - touchStart.y;
        cameraTheta -= dx * 0.008;
        cameraPhi += dy * 0.008;
        cameraPhi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPhi));
        touchStart.x = e.touches[0].clientX;
        touchStart.y = e.touches[0].clientY;
        dirty = true;
      } else if (touchStart.mode === 'pinch' && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const newDist = Math.sqrt(dx*dx + dy*dy);
        cameraDist *= touchStart.dist / newDist;
        cameraDist = Math.max(200, Math.min(8000, cameraDist));
        touchStart.dist = newDist;
        dirty = true;
      }
    }, { passive: false });
  }

  function updateCamera() {
    const sinPhi = Math.sin(cameraPhi);
    const cosPhi = Math.cos(cameraPhi);
    camera.position.set(
      cameraTarget.x + cameraDist * sinPhi * Math.cos(cameraTheta),
      cameraTarget.y + cameraDist * cosPhi,
      cameraTarget.z + cameraDist * sinPhi * Math.sin(cameraTheta)
    );
    camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);
  }

  function updateSun() {
    const v = SAAS.viz3d;
    const loc = findLatLng();
    // Determine date
    const dateMap = {
      summer:  new Date(new Date().getFullYear(), 5, 21), // Jun 21
      equinox: new Date(new Date().getFullYear(), 8, 21), // Sep 21
      winter:  new Date(new Date().getFullYear(), 11, 21) // Dec 21
    };
    const baseDate = dateMap[v._date || 'equinox'];
    const hour = v._hour ?? 12;
    const date = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(),
                          Math.floor(hour), Math.round((hour - Math.floor(hour)) * 60));
    const pos = getSunPosition(date, loc.lat, loc.lng);

    // Convert to Three.js coords (+X east, +Y up, +Z south)
    // SunCalc: azimuth 0=south, +π/2=west, ±π=north, -π/2=east
    const az = pos.azimuth;
    const alt = pos.altitude;
    const distance = 3000;
    const sx = -Math.sin(az) * Math.cos(alt) * distance; // east is +x; sin(az) for south=0, west=+1; west=-x
    const sz = Math.cos(az) * Math.cos(alt) * distance;  // south=+z
    const sy = Math.sin(alt) * distance;
    sunLight.position.set(sx, Math.max(50, sy), sz); // never put below ground for shadow camera
    sunLight.target.position.set(0, 0, 0);
    sunMesh.position.set(sx, sy, sz);
    sunMesh.visible = sy > 0;

    // Adjust ambient based on altitude (dim at sunset / sunrise)
    if (sy > 0) {
      const intensity = Math.min(1.1, 0.4 + alt * 0.9);
      sunLight.intensity = intensity;
      ambientLight.intensity = 0.35 + alt * 0.3;
    } else {
      sunLight.intensity = 0.05;
      ambientLight.intensity = 0.25;
    }
    renderer.shadowMap.enabled = !!v._shadows;

    // Sun arc visualization
    if (sunArcLine) { scene.remove(sunArcLine); sunArcLine = null; }
    if (v._sunarc) {
      const points = [];
      for (let h = 5; h <= 19; h += 0.25) {
        const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(),
                           Math.floor(h), Math.round((h - Math.floor(h)) * 60));
        const sp = getSunPosition(d, loc.lat, loc.lng);
        if (sp.altitude > 0) {
          const ax = -Math.sin(sp.azimuth) * Math.cos(sp.altitude) * distance;
          const az_ = Math.cos(sp.azimuth) * Math.cos(sp.altitude) * distance;
          const ay = Math.sin(sp.altitude) * distance;
          points.push(new THREE.Vector3(ax, ay, az_));
        }
      }
      if (points.length > 1) {
        const g = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
          color: v._date === 'summer' ? 0xf59e0b : (v._date === 'winter' ? 0xffffff : 0x5BBCE4),
          transparent: true, opacity: 0.55
        });
        sunArcLine = new THREE.Line(g, mat);
        scene.add(sunArcLine);
      }
    }

    if (gridHelper) gridHelper.visible = !!v._grid;

    // Update side panel readout
    const readout = document.getElementById('saas-3d-readout');
    if (readout) {
      readout.innerHTML = `
        <div class="saas-3d-readout-row"><span class="saas-3d-readout-label">Location</span><span class="saas-3d-readout-val">${loc.source}${loc.zip ? ' · ' + loc.zip : ''}</span></div>
        <div class="saas-3d-readout-row"><span class="saas-3d-readout-label">Latitude</span><span class="saas-3d-readout-val">${loc.lat.toFixed(2)}°</span></div>
        <div class="saas-3d-readout-row"><span class="saas-3d-readout-label">Longitude</span><span class="saas-3d-readout-val">${loc.lng.toFixed(2)}°</span></div>
        <div class="saas-3d-readout-row"><span class="saas-3d-readout-label">Sun azimuth</span><span class="saas-3d-readout-val">${(az * 180 / Math.PI + 180).toFixed(0)}°</span></div>
        <div class="saas-3d-readout-row"><span class="saas-3d-readout-label">Sun altitude</span><span class="saas-3d-readout-val">${(alt * 180 / Math.PI).toFixed(0)}°</span></div>
      `;
    }

    // Update time display
    const timeDisp = document.getElementById('saas-3d-time-display');
    if (timeDisp) {
      const h = Math.floor(hour);
      const m = Math.round((hour - h) * 60);
      const period = h < 12 ? 'AM' : 'PM';
      const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
      timeDisp.textContent = `${h12}:${String(m).padStart(2, '0')} ${period}`;
    }

    // Update sun-path SVG
    drawSunPathSVG(loc, v._date || 'equinox', hour, az, alt);

    // Update header stats
    const stats = document.getElementById('saas-3d-stats');
    if (stats) {
      const m = getSectionMetrics();
      stats.innerHTML = `
        <span class="saas-3d-stat">${m.sections.length} <strong>sections</strong></span>
        <span class="saas-3d-stat">${m.totalKw.toFixed(1)} <strong>kW DC</strong></span>
        <span class="saas-3d-stat">tilt <strong>${getSpacing().tilt}°</strong></span>
      `;
    }
  }

  function drawSunPathSVG(loc, season, hour, currentAz, currentAlt) {
    const svg = document.getElementById('saas-sunpath-svg');
    if (!svg) return;
    const W = 280, H = 160;
    // Polar projection: horizon = circle, zenith = center
    const cx = W / 2, cy = H - 12, r = Math.min(W * 0.42, H - 30);

    // Draw horizon arc + cardinal points
    let html = `
      <g class="saas-sunpath-grid">
        <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" class="saas-sunpath-horizon"/>
        <line x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}" />
        <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - r}" />
      </g>
      <text x="${cx - r - 4}" y="${cy + 4}" text-anchor="end" class="saas-sunpath-label">E</text>
      <text x="${cx + r + 4}" y="${cy + 4}" text-anchor="start" class="saas-sunpath-label">W</text>
      <text x="${cx}" y="${cy - r - 3}" text-anchor="middle" class="saas-sunpath-label">N</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" class="saas-sunpath-label">S</text>
    `;

    function project(az, alt) {
      // SunCalc: az 0=south, π/2=west, -π/2=east, ±π=north
      // Polar: x = -sin(az)*r*(1-alt/half) … no let's do: dist from center = r*(1 - alt/(π/2))
      const distFromCenter = r * (1 - alt / (PI / 2));
      // azimuth: north = up (-y), east = -x, south = +y (but we put south at bottom of SVG, so cy + something)
      // We want: south=down, north=up, east=left, west=right
      const x = cx - distFromCenter * Math.sin(az);
      const y = cy - distFromCenter * Math.cos(az);
      return { x, y };
    }

    // Three arcs
    const year = new Date().getFullYear();
    const dates = {
      summer:  new Date(year, 5, 21),
      equinox: new Date(year, 8, 21),
      winter:  new Date(year, 11, 21)
    };
    Object.entries(dates).forEach(([key, date]) => {
      const points = [];
      for (let h = 4; h <= 20; h += 0.25) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(),
                           Math.floor(h), Math.round((h - Math.floor(h)) * 60));
        const sp = getSunPosition(d, loc.lat, loc.lng);
        if (sp.altitude > 0) {
          const p = project(sp.azimuth, sp.altitude);
          points.push(p);
        }
      }
      if (points.length < 2) return;
      const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      html += `<path d="${path}" class="saas-sunpath-arc-${key}"/>`;
    });

    // Current sun position (only if above horizon)
    if (currentAlt > 0) {
      const p = project(currentAz, currentAlt);
      html += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" class="saas-sunpath-sun"/>`;
    }
    svg.innerHTML = html;
  }

  function renderLoop() {
    if (dirty || true) {  // re-render on every frame (smoother during interactions; layout is small)
      updateCamera();
      renderer.render(scene, camera);
      dirty = false;
    }
    frame = requestAnimationFrame(renderLoop);
  }

  function disposeScene() {
    if (frame) cancelAnimationFrame(frame);
    frame = null;
    if (renderer) {
      renderer.dispose();
      renderer.domElement?.remove();
    }
    scene = camera = renderer = sunLight = ambientLight = sunMesh = sunArcLine = gridHelper = null;
  }

  /* ────────────────────────────────────────────────────────────────────────
     SAAS.viz3d API
     ──────────────────────────────────────────────────────────────────────── */
  SAAS.viz3d = {
    _date: 'equinox',
    _hour: 12,
    _shadows: true,
    _sunarc: true,
    _grid: false,
    async open() {
      const m = document.getElementById('saas-3d-modal');
      m.classList.add('show');
      document.body.style.overflow = 'hidden';
      try {
        const THREE = await loadThree();
        const ok = buildScene(THREE);
        if (ok) {
          updateSun();
          renderLoop();
          window.addEventListener('resize', this._onResize);
        }
      } catch (e) {
        console.error('[SAAS Phase 4] 3D load failed', e);
        document.getElementById('saas-3d-loading').innerHTML = '<span style="color:#ef4444">Could not load Three.js. Check your internet connection.</span>';
      }
    },
    close() {
      const m = document.getElementById('saas-3d-modal');
      m.classList.remove('show');
      document.body.style.overflow = '';
      window.removeEventListener('resize', this._onResize);
      disposeScene();
    },
    _update() { if (renderer) updateSun(); },
    _onResize() {
      if (!renderer || !camera) return;
      const wrap = document.getElementById('saas-3d-canvas-wrap');
      const W = wrap.clientWidth, H = wrap.clientHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    }
  };

  /* ────────────────────────────────────────────────────────────────────────
     BOM POST-COUNT CORRECTION
     ─────────────────────────────────────────────────────────────────────────
     The host configurator assumes 4 posts per section. The actual SEMS
     structural design uses ONE post per section boundary (at the ridge),
     SHARED with adjacent sections. So a row of N sections has N+1 posts,
     not 4N. This wrapper rewrites the totals + per-section post counts
     after `calculateProjectTotals` runs, so the BOM and summary reflect
     the same logic shown in the 3D preview.
     ──────────────────────────────────────────────────────────────────────── */
  function correctedPostCount() {
    const layout = host_layout();
    let total = 0;
    layout.forEach(row => {
      const n = (row.sections || []).length;
      if (n > 0) total += n + 1;
    });
    return total;
  }

  function applyPostCorrection(calc) {
    if (!calc || !calc.totals) return calc;

    const layout = host_layout();
    const correctTotal = correctedPostCount();

    // Per-section post allocation:
    // First section in a row: 2 posts (left + right)
    // Subsequent sections: 1 post each (the right edge; left is shared)
    // This is consistent with the "shared post" rule and totals to N+1 for N sections.
    if (calc.breakdowns && Array.isArray(calc.breakdowns)) {
      let bdIdx = 0;
      layout.forEach(row => {
        (row.sections || []).forEach((sec, si) => {
          if (bdIdx < calc.breakdowns.length) {
            calc.breakdowns[bdIdx].posts = (si === 0) ? 2 : 1;
            bdIdx++;
          }
        });
      });
    }

    calc.totals.posts = correctTotal;
    return calc;
  }

  function installBomPatch() {
    if (typeof window.calculateProjectTotals !== 'function') return;
    if (window.calculateProjectTotals._saasPhase4Patched) return;
    const orig = window.calculateProjectTotals;
    const wrapped = function () {
      const result = orig.apply(this, arguments);
      return applyPostCorrection(result);
    };
    wrapped._saasPhase4Patched = true;
    window.calculateProjectTotals = wrapped;

    // Also patch the narrative description so it doesn't say "4 posts per section"
    document.querySelectorAll('li, p, span').forEach(el => {
      // Look at innerHTML and only proceed if it includes the exact phrase
      if (!el.innerHTML || !el.innerHTML.includes('4 posts per section')) return;
      // Only do simple replacement if this element doesn't contain other tags besides <strong>
      const childTags = Array.from(el.children).map(c => c.tagName);
      const onlySimpleChildren = childTags.every(t => t === 'STRONG' || t === 'EM' || t === 'B' || t === 'I');
      if (!onlySimpleChildren) return;
      el.innerHTML = el.innerHTML.replace(
        /4 posts per section[^<]*/g,
        'Posts at section boundaries (shared between adjacent sections); a row of N sections uses N+1 posts.'
      );
    });
  }

  /* ────────────────────────────────────────────────────────────────────────
     INIT
     ──────────────────────────────────────────────────────────────────────── */
  function init() {
    buildHeatToolbar();
    build3DModal();
    installBomPatch();

    // Trigger a recalc so the patched post count flows into BOM + summary immediately
    if (typeof window.recalcAll === 'function') {
      try { window.recalcAll(); } catch {}
    }

    // Re-apply heatmap whenever canvas re-renders
    if (typeof window.renderCanvas === 'function') {
      const orig = window.renderCanvas;
      window.renderCanvas = function () {
        const r = orig.apply(this, arguments);
        if (currentHeatMode !== 'none') setTimeout(applyHeatmap, 10);
        return r;
      };
    }

    console.log('[SEMS SaaS Layer] Phase 4 (Visualization + BOM post correction) ready.');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 180));
  } else {
    setTimeout(init, 180);
  }
})();
</script>
