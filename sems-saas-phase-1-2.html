/* ══════════ NAV RAIL ══════════ */
.saas-rail {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 64px;
  background: var(--pure-white, #F5F6F8);
  border-right: 1px solid var(--gray-200, #C8D0DC);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 12px;
  gap: 6px;
  box-shadow: var(--shadow-sm, 0 1px 4px rgba(27,58,92,0.1));
}
.saas-rail-logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--blue-700, #2660A4), var(--blue-500, #3B8FDB));
  color: white;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  box-shadow: var(--shadow-md, 0 4px 20px rgba(27,58,92,0.12));
}
.saas-rail-divider {
  width: 32px;
  height: 1px;
  background: var(--gray-200, #C8D0DC);
  margin: 4px 0;
}
.saas-rail-item {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: all 0.18s ease;
  color: var(--gray-500, #5A6578);
  font-size: 18px;
  background: transparent;
  border: none;
  font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
}
.saas-rail-item:hover {
  background: var(--blue-50, #DFE7EE);
  color: var(--blue-700, #2660A4);
  transform: translateX(2px);
}
.saas-rail-item.active {
  background: var(--blue-700, #2660A4);
  color: white;
  box-shadow: var(--shadow-md, 0 4px 20px rgba(27,58,92,0.12));
}
.saas-rail-item.active::before {
  content: '';
  position: absolute;
  left: -12px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--blue-500, #3B8FDB);
}
.saas-rail-item .badge {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--blue-500, #3B8FDB);
  color: white;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  padding: 0 4px;
  border: 2px solid var(--pure-white, #F5F6F8);
}
.saas-rail-item .badge.warn { background: #f59e0b; }
.saas-rail-item .badge.ok   { background: #10b981; }
.saas-rail-item .badge.err  { background: #ef4444; }
.saas-rail-item .check {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #10b981;
  color: white;
  font-size: 8px;
  display: grid;
  place-items: center;
  border: 2px solid var(--pure-white, #F5F6F8);
}
.saas-rail-tooltip {
  position: absolute;
  left: calc(100% + 12px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--gray-900, #1A1E24);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: all 0.18s ease;
  z-index: 1001;
  letter-spacing: 0.01em;
}
.saas-rail-tooltip::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
  width: 8px;
  height: 8px;
  background: var(--gray-900, #1A1E24);
}
.saas-rail-item:hover .saas-rail-tooltip {
  opacity: 1;
  visibility: visible;
  transform: translateY(-50%) translateX(0);
}
.saas-rail-spacer { flex: 1; }

@media (max-width: 980px) {

.saas-progress-actions {
  display: flex;

}
.saas-pbtn {
  background: var(--white, #EBEEF2);

  letter-spacing: 0.02em;
  font-family: inherit;

.saas-pbtn:hover { background: var(--blue-50, #DFE7EE); border-color: var(--blue-200, #A0CCDF); color: var(--blue-700, #2660A4); }

.saas-pbtn .kbd {

  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;

}

@media (max-width: 720px) {
  .saas-progress-stat { display: none; }
  .saas-progress { gap: 10px; padding: 8px 14px; }

/* ══════════ CARD STATUS PILLS (injected into existing cfg-card-head) ══════════ */
.saas-card-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;

<!-- ══════════ MARKUP (injected JS-side, but defining shells here is fine) ══════════ -->
<div id="saas-root"></div>


<script>
/* ══════════════════════════════════════════════════════════════════════════
   SAAS LAYER · Phase 1 + 2 ENGINE
   Self-attaches on window load. No edits required to existing configurator.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // Wait for the host configurator to initialize before attaching.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  function boot() {
    // Give host scripts a moment to finish their initial render.
    setTimeout(init, 60);
  }

  /* ────────────────────────────────────────────────────────────────────────
     HOST GLOBAL ACCESSORS · the configurator declares its state via `let`,
     which is NOT exposed on window. `new Function(...)` runs in global
     scope so these helpers can read & write those bindings reliably.
     ──────────────────────────────────────────────────────────────────────── */
  const _getLayout = new Function('return typeof layoutState!=="undefined"?layoutState:null;');
  const _setLayoutContents = new Function('a', 'if(typeof layoutState!=="undefined"){layoutState.length=0;for(var i=0;i<a.length;i++)layoutState.push(a[i]);}');
  const _getNextSec = new Function('return typeof _nextSectionId!=="undefined"?_nextSectionId:1;');
  const _setNextSec = new Function('v', 'if(typeof _nextSectionId!=="undefined")_nextSectionId=v;');
  const _getNextRow = new Function('return typeof _nextRowId!=="undefined"?_nextRowId:1;');
  const _setNextRow = new Function('v', 'if(typeof _nextRowId!=="undefined")_nextRowId=v;');

  function host_layout()        { return _getLayout() || []; }
  function host_setLayout(arr)  { _setLayoutContents(arr || []); }
  function host_nextSec()       { return _getNextSec(); }
  function host_setNextSec(v)   { _setNextSec(v); }
  function host_nextRow()       { return _getNextRow(); }
  function host_setNextRow(v)   { _setNextRow(v); }

  /* ────────────────────────────────────────────────────────────────────────
     STATE & STORAGE
     ──────────────────────────────────────────────────────────────────────── */
  const SK = {
    layer: 'sems_saas_v1',         // tour state, current project pointer
    projects: 'sems_saas_projects' // array of saved projects
  };

  const SAAS = {
    state: {
      tourCompleted: false,
      currentProjectId: null,
      undo: [],
      redo: [],
      maxStack: 30,
      capturing: true
    },
    sections: [
      { id: 'card-project',   label: 'Project',    icon: '◫',  required: ['projectName'] },
      { id: 'card-builder',   label: 'Builder',    icon: '▦',  required: ['_layout'] },
      { id: 'card-config',    label: 'Config',     icon: '⚙',  required: ['panelModel','inverterModel'] },
      { id: 'card-site',      label: 'Site',       icon: '⏚',  required: ['windSpeed','soilClass'] },
      { id: 'card-foundation',label: 'Foundation', icon: '⚓',  required: [] },
      { id: 'card-summary',   label: 'Summary',    icon: '⚡',  required: [] },
      { id: 'card-bom',       label: 'BOM',        icon: '⊞',  required: ['_layout'] },
      { id: 'card-export',    label: 'Export',     icon: '↓',  required: [] }
    ]
  };

  function loadLayer() {
    try { return JSON.parse(localStorage.getItem(SK.layer) || '{}'); }
    catch { return {}; }
  }
  function saveLayer(data) {
    try { localStorage.setItem(SK.layer, JSON.stringify(data)); } catch {}
  }
  function loadProjects() {
    try { return JSON.parse(localStorage.getItem(SK.projects) || '[]'); }
    catch { return []; }
  }
  function saveProjects(list) {
    try { localStorage.setItem(SK.projects, JSON.stringify(list)); } catch {}
  }

  function safeToast(msg) {
    if (typeof window.toast === 'function') return window.toast(msg);
    console.log('[SAAS]', msg);
  }

  /* ────────────────────────────────────────────────────────────────────────
     BOOT
     ──────────────────────────────────────────────────────────────────────── */
  function init() {
    document.body.classList.add('saas-on');

    // Hydrate state.
    const layer = loadLayer();
    SAAS.state.tourCompleted = !!layer.tourCompleted;
    SAAS.state.currentProjectId = layer.currentProjectId || null;

    // Build UI.
    buildRail();
    buildProgress();
    buildPalette();
    buildModal();
    buildDrawer();
    buildWizard();
    buildTour();
    buildFabs();
    injectStatusPills();

    // Wire everything up.
    wrapMutators();
    bindShortcuts();
    bindScrollSpy();
    setupChangeWatchers();

    // First refresh.
    refreshAll();

    // First-run · only auto-show if user has no SaaS history AND no existing layout/projects.
    if (!SAAS.state.tourCompleted) {
      const hasLayoutData = host_layout().some(r => (r.sections || []).length > 0);
      const hasSavedProjects = loadProjects().length > 0;
      const hasHostSave = !!localStorage.getItem('sems_array_builder_v2');
      const isReturningUser = hasLayoutData || hasSavedProjects || hasHostSave;
      if (!isReturningUser) {
        setTimeout(() => SAAS.tour.start(), 500);
      } else {
        // Mark complete silently so we don't keep checking.
        const layer = loadLayer(); layer.tourCompleted = true; saveLayer(layer);
        SAAS.state.tourCompleted = true;
      }
    }

    console.log('[SEMS SaaS Layer] Phase 1+2 ready.');
  }

  /* ────────────────────────────────────────────────────────────────────────
     1. NAV RAIL
     ──────────────────────────────────────────────────────────────────────── */
  function buildRail() {
    const rail = document.createElement('aside');
    rail.className = 'saas-rail';
    rail.id = 'saas-rail';
    rail.innerHTML = `
      <div class="saas-rail-logo" title="SEMS Configurator">S</div>
      <div class="saas-rail-divider"></div>
      ${SAAS.sections.map((s, i) => `
        <button class="saas-rail-item" data-target="${s.id}" data-section-id="${s.id}">
          <span class="saas-rail-ico">${s.icon}</span>
          <span class="saas-rail-tooltip">${s.label}</span>
        </button>
      `).join('')}
      <div class="saas-rail-spacer"></div>
      <button class="saas-rail-item" data-action="palette">
        <span>⌘</span>
        <span class="saas-rail-tooltip">Command palette · ⌘K</span>
      </button>
      <button class="saas-rail-item" data-action="projects">
        <span>≡</span>
        <span class="saas-rail-tooltip">Projects</span>
      </button>
    `;
    document.body.appendChild(rail);

    // Click handlers
    rail.querySelectorAll('[data-target]').forEach(el => {
      el.addEventListener('click', () => scrollToCard(el.dataset.target));
    });
    rail.querySelector('[data-action="palette"]').addEventListener('click', () => SAAS.palette.open());
    rail.querySelector('[data-action="projects"]').addEventListener('click', () => SAAS.drawer.open());
  }

  function scrollToCard(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const offset = 140; // account for sticky nav + progress
    const top = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top, behavior: 'smooth' });
  }

  /* ────────────────────────────────────────────────────────────────────────
     2. PROGRESS BAR
     ──────────────────────────────────────────────────────────────────────── */
  function buildProgress() {
    const bar = document.createElement('div');
    bar.className = 'saas-progress';
    bar.id = 'saas-progress';
    bar.innerHTML = `
      <div class="saas-progress-label" id="saas-progress-pct">0%</div>
      <div class="saas-progress-track"><div class="saas-progress-fill" id="saas-progress-fill"></div></div>
      <span class="saas-progress-stat ok" id="saas-progress-sections">0 sections</span>
      <span class="saas-progress-stat" id="saas-progress-kw">0 kW DC</span>
      <span class="saas-progress-stat warn saas-hide" id="saas-progress-warnings">0 warnings</span>
      <div class="saas-progress-spacer"></div>
      <div class="saas-progress-actions">
        <button class="saas-pbtn" id="saas-undo" title="Undo">↶<span class="kbd">⌘Z</span></button>
        <button class="saas-pbtn" id="saas-redo" title="Redo">↷<span class="kbd">⌘⇧Z</span></button>
        <button class="saas-pbtn" id="saas-cmd" title="Command palette">⌘<span class="kbd">⌘K</span></button>
      </div>
    `;

    // Insert directly under the existing nav for the host page.
    const hostNav = document.querySelector('.nav');
    if (hostNav && hostNav.parentNode) {
      hostNav.parentNode.insertBefore(bar, hostNav.nextSibling);
    } else {
      document.body.insertBefore(bar, document.body.firstChild);
    }

    document.getElementById('saas-undo').addEventListener('click', () => SAAS.undo.undo());
    document.getElementById('saas-redo').addEventListener('click', () => SAAS.undo.redo());
    document.getElementById('saas-cmd').addEventListener('click', () => SAAS.palette.open());
  }

  function refreshProgress() {
    const status = computeStatuses();
    const completedCount = status.filter(s => s.state === 'complete').length;
    const totalCount = SAAS.sections.length;
    const pct = Math.round((completedCount / totalCount) * 100);

    document.getElementById('saas-progress-fill').style.width = pct + '%';
    document.getElementById('saas-progress-pct').textContent = pct + '% complete';

    // Section / kW stats.
    const layout = host_layout();
    const totalSecs = layout.reduce((acc, r) => acc + (r.sections?.length || 0), 0);
    const panelW = parseFloat(document.getElementById('panelWidth')?.value) || 41.3;
    const panelWatt = parseFloat(document.getElementById('panelWattage')?.value) || 430;
    let totalMods = 0;
    layout.forEach(r => (r.sections || []).forEach(s => {
      try {
        const c = window.getSectionModuleCount(s.type, panelW);
        totalMods += c.modules || 0;
      } catch {}
    }));
    const kw = (totalMods * panelWatt) / 1000;

    document.getElementById('saas-progress-sections').textContent =
      totalSecs + ' section' + (totalSecs !== 1 ? 's' : '');
    document.getElementById('saas-progress-kw').textContent =
      kw >= 1000 ? (kw / 1000).toFixed(2) + ' MW DC' : kw.toFixed(1) + ' kW DC';

    // Update undo/redo buttons.
    document.getElementById('saas-undo').disabled = SAAS.state.undo.length === 0;
    document.getElementById('saas-redo').disabled = SAAS.state.redo.length === 0;
  }

  /* ────────────────────────────────────────────────────────────────────────
     3. VALIDATION BADGES
     ──────────────────────────────────────────────────────────────────────── */
  function injectStatusPills() {
    SAAS.sections.forEach(s => {
      const card = document.getElementById(s.id);
      if (!card) return;
      const head = card.querySelector('.cfg-card-head');
      if (!head) return;
      if (head.querySelector('.saas-card-status')) return;

      const pill = document.createElement('span');
      pill.className = 'saas-card-status empty';
      pill.dataset.sectionId = s.id;
      pill.innerHTML = `<span class="dot"></span><span class="label">Empty</span>`;
      head.appendChild(pill);
    });
  }

  function computeStatuses() {
    const form = (typeof window.getFormState === 'function') ? window.getFormState() : {};
    const layout = host_layout();
    const hasLayout = layout.some(r => (r.sections || []).length > 0);

    return SAAS.sections.map(s => {
      // Special cases
      if (s.id === 'card-builder' || s.id === 'card-bom') {
        return { id: s.id, state: hasLayout ? 'complete' : 'empty', label: hasLayout ? 'Ready' : 'Empty' };
      }
      if (s.id === 'card-foundation') {
        const ws = parseFloat(document.getElementById('windSpeed')?.value);
        const sc = document.getElementById('soilClass')?.value;
        if (ws && sc && hasLayout) return { id: s.id, state: 'complete', label: 'Ready' };
        return { id: s.id, state: 'empty', label: 'Pending inputs' };
      }
      if (s.id === 'card-summary') {
        return { id: s.id, state: hasLayout ? 'complete' : 'empty', label: hasLayout ? 'Live' : 'No data' };
      }
      if (s.id === 'card-export') {
        return { id: s.id, state: hasLayout ? 'complete' : 'empty', label: hasLayout ? 'Ready' : 'No data' };
      }
      // Generic: required form keys
      const filled = (s.required || []).every(k => {
        const v = form[k];
        return v !== '' && v !== null && v !== undefined;
      });
      const total = (s.required || []).length;
      const filledCount = (s.required || []).filter(k => {
        const v = form[k];
        return v !== '' && v !== null && v !== undefined;
      }).length;
      if (total === 0) return { id: s.id, state: 'complete', label: 'OK' };
      if (filled) return { id: s.id, state: 'complete', label: 'Complete' };
      if (filledCount > 0) return { id: s.id, state: 'partial', label: `${filledCount}/${total}` };
      return { id: s.id, state: 'empty', label: 'Empty' };
    });
  }

  function refreshStatuses() {
    const statuses = computeStatuses();
    statuses.forEach(s => {
      const pill = document.querySelector(`.saas-card-status[data-section-id="${s.id}"]`);
      if (pill) {
        pill.className = 'saas-card-status ' + s.state;
        pill.querySelector('.label').textContent = s.label;
      }
      // Rail badge
      const rail = document.querySelector(`.saas-rail-item[data-section-id="${s.id}"]`);
      if (rail) {
        const old = rail.querySelector('.check, .badge');
        if (old) old.remove();
        if (s.state === 'complete') {
          const check = document.createElement('span');
          check.className = 'check';
          check.textContent = '✓';
          rail.appendChild(check);
        } else if (s.state === 'partial') {
          const badge = document.createElement('span');
          badge.className = 'badge warn';
          badge.textContent = '!';
          rail.appendChild(badge);
        }
      }
    });
  }

  function safe(fnName, ...args) {
    if (typeof window[fnName] === 'function') {
      try { window[fnName](...args); }

    } else {
      safeToast('Function not available: ' + fnName);
    }
  }

  function buildPalette() {
    const overlay = document.createElement('div');
    overlay.className = 'saas-overlay';
    overlay.id = 'saas-palette-overlay';
    overlay.innerHTML = `
      <div class="saas-palette" role="dialog" aria-label="Command palette">
        <div class="saas-palette-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" class="saas-palette-input" id="saas-palette-input"
                 placeholder="Search actions, sections, or type a command…" autocomplete="off">
          <span class="saas-kbd">ESC</span>
        </div>
        <div class="saas-palette-results" id="saas-palette-results"></div>
      </div>
    `;
    document.body.appendChild(overlay);

    const input = document.getElementById('saas-palette-input');
    const results = document.getElementById('saas-palette-results');
    let focusedIdx = 0;
    let visible = [];

    function render(query) {
      const q = (query || '').trim().toLowerCase();
      const filtered = q
        ? PALETTE_ACTIONS.filter(a =>
            a.label.toLowerCase().includes(q) ||
            (a.sub || '').toLowerCase().includes(q) ||
            (a.group || '').toLowerCase().includes(q))
        : PALETTE_ACTIONS;

      visible = filtered;
      focusedIdx = 0;

      if (!filtered.length) {
        results.innerHTML = '<div class="saas-palette-empty">No matching actions. Try “add”, “export”, or “jump”.</div>';
        return;
      }

      const groups = {};
      filtered.forEach(a => {
        groups[a.group || 'Other'] = groups[a.group || 'Other'] || [];
        groups[a.group || 'Other'].push(a);
      });

      let html = '';
      let idx = 0;
      Object.keys(groups).forEach(g => {
        html += `<div class="saas-palette-group-label">${g}</div>`;
        groups[g].forEach(a => {
          html += `
            <div class="saas-palette-item ${idx === 0 ? 'focused' : ''}" data-idx="${idx}" data-action-id="${a.id}">
              <div class="saas-palette-item-icon">${a.icon || '•'}</div>
              <div class="saas-palette-item-body">
                <div class="saas-palette-item-title">${a.label}</div>
                ${a.sub ? `<div class="saas-palette-item-sub">${a.sub}</div>` : ''}
              </div>
            </div>
          `;
          idx++;
        });
      });
      results.innerHTML = html;

      results.querySelectorAll('.saas-palette-item').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.dataset.actionId;
          const action = PALETTE_ACTIONS.find(a => a.id === id);
          close();
          setTimeout(() => action && action.run(), 50);
        });
        item.addEventListener('mousemove', () => {
          results.querySelectorAll('.saas-palette-item').forEach(i => i.classList.remove('focused'));
          item.classList.add('focused');
          focusedIdx = parseInt(item.dataset.idx, 10);
        });
      });
    }

    function moveFocus(delta) {
      if (!visible.length) return;
      focusedIdx = (focusedIdx + delta + visible.length) % visible.length;
      results.querySelectorAll('.saas-palette-item').forEach(i => i.classList.remove('focused'));
      const target = results.querySelector(`.saas-palette-item[data-idx="${focusedIdx}"]`);
      if (target) {
        target.classList.add('focused');
        target.scrollIntoView({ block: 'nearest' });
      }
    }

    input.addEventListener('input', e => render(e.target.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const a = visible[focusedIdx];
        if (a) { close(); setTimeout(() => a.run(), 50); }
      } else if (e.key === 'Escape') { close(); }
    });

    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

    function open() {
      overlay.classList.add('show');
      input.value = '';
      render('');
      setTimeout(() => input.focus(), 30);
    }
    function close() { overlay.classList.remove('show'); }

    SAAS.palette = { open, close };
  }

  /* ────────────────────────────────────────────────────────────────────────
     5. UNDO / REDO
     ──────────────────────────────────────────────────────────────────────── */
  function snapshot() {
    return {
      form: (typeof window.getFormState === 'function') ? JSON.parse(JSON.stringify(window.getFormState())) : {},
      layout: JSON.parse(JSON.stringify(host_layout())),
      nextSec: host_nextSec(),
      nextRow: host_nextRow(),
      ts: Date.now()
    };
  }
  function applySnapshot(snap) {
    if (!snap) return;
    SAAS.state.capturing = false;
    if (snap.form && typeof window.setFormState === 'function') window.setFormState(snap.form);
    if (typeof window.syncPanelFields === 'function') window.syncPanelFields();
    host_setLayout(JSON.parse(JSON.stringify(snap.layout || [])));
    if (typeof snap.nextSec === 'number') host_setNextSec(snap.nextSec);
    if (typeof snap.nextRow === 'number') host_setNextRow(snap.nextRow);
    if (typeof window.renderCanvas === 'function') window.renderCanvas();
    if (typeof window.recalcAll === 'function') window.recalcAll();
    SAAS.state.capturing = true;
    refreshAll();
  }
  function captureUndo() {
    if (!SAAS.state.capturing) return;
    SAAS.state.undo.push(snapshot());
    if (SAAS.state.undo.length > SAAS.state.maxStack) SAAS.state.undo.shift();
    SAAS.state.redo = [];
  }
  function withoutCapture(fn) {
    const prev = SAAS.state.capturing;
    SAAS.state.capturing = false;
    try { fn(); } finally { SAAS.state.capturing = prev; }
  }
  SAAS.undo = {
    undo() {
      if (SAAS.state.undo.length === 0) { safeToast('Nothing to undo'); return; }
      const current = snapshot();
      const prev = SAAS.state.undo.pop();
      SAAS.state.redo.push(current);
      applySnapshot(prev);
      safeToast('Undo');
    },
    redo() {
      if (SAAS.state.redo.length === 0) { safeToast('Nothing to redo'); return; }
      const current = snapshot();
      const next = SAAS.state.redo.pop();
      SAAS.state.undo.push(current);
      applySnapshot(next);
      safeToast('Redo');
    }
  };

  function wrapMutators() {
    const wrap = ['addRow','addSectionToRow','removeRow','removeSectionById','duplicateSection',
                  'quickAdd','clearLayout','autoBalance','convertAll','generateSystem','setFormState','resetAll'];
    wrap.forEach(name => {
      const orig = window[name];
      if (typeof orig !== 'function') return;
      window[name] = function () {
        captureUndo();
        const result = orig.apply(this, arguments);
        // Defer refresh so DOM has settled.
        setTimeout(refreshAll, 30);
        return result;
      };
    });
  }

  function buildDrawer() {
    const d = document.createElement('aside');
    d.className = 'saas-drawer';
    d.id = 'saas-drawer';
    d.innerHTML = `
      <div class="saas-drawer-head">
        <div>
          <div class="saas-modal-title">Projects</div>
          <div class="saas-modal-sub">All saved on this device</div>
        </div>
        <button class="saas-modal-close" id="saas-drawer-close">×</button>
      </div>
      <div class="saas-drawer-body" id="saas-drawer-body"></div>
      <div class="saas-drawer-foot">
        <button class="saas-btn saas-btn-out" id="saas-drawer-new">+ New project</button>
        <button class="saas-btn saas-btn-pri" id="saas-drawer-save">Save current</button>
      </div>
    `;
    document.body.appendChild(d);

    document.getElementById('saas-drawer-close').addEventListener('click', () => SAAS.drawer.close());
    document.getElementById('saas-drawer-new').addEventListener('click', () => {
      SAAS.drawer.close();
      SAAS.modal.openTemplates();
    });
    document.getElementById('saas-drawer-save').addEventListener('click', () => SAAS.drawer.saveCurrent());

    // Click outside drawer (on backdrop) to close.
    d.addEventListener('click', e => { if (e.target === d) SAAS.drawer.close(); });

    SAAS.drawer = {
      open() {
        d.classList.add('show');
        renderProjects();
      },
      close() { d.classList.remove('show'); },
      saveCurrent() {
        const list = loadProjects();
        const form = window.getFormState ? window.getFormState() : {};
        const name = form.projectName || 'Untitled Project';
        const id = SAAS.state.currentProjectId || ('p' + Date.now());
        const data = {
          id,
          name,
          customer: form.customerName || '',
          updatedAt: Date.now(),
          form,
          layout: host_layout(),
          nextSec: host_nextSec(),
          nextRow: host_nextRow()
        };
        const idx = list.findIndex(p => p.id === id);
        if (idx >= 0) list[idx] = data; else list.unshift(data);
        saveProjects(list);
        SAAS.state.currentProjectId = id;
        const layer = loadLayer(); layer.currentProjectId = id; saveLayer(layer);
        renderProjects();
        safeToast('Saved “' + name + '”');
      },
      load(id) {
        const list = loadProjects();
        const p = list.find(x => x.id === id);
        if (!p) return;
        SAAS.state.capturing = false;
        if (p.form && window.setFormState) window.setFormState(p.form);
        if (window.syncPanelFields) window.syncPanelFields();
        host_setLayout(JSON.parse(JSON.stringify(p.layout || [])));
        if (typeof p.nextSec === 'number') host_setNextSec(p.nextSec);
        if (typeof p.nextRow === 'number') host_setNextRow(p.nextRow);
        if (window.renderCanvas) window.renderCanvas();
        if (window.recalcAll) window.recalcAll();
        SAAS.state.capturing = true;
        SAAS.state.undo = []; SAAS.state.redo = [];
        SAAS.state.currentProjectId = id;
        const layer = loadLayer(); layer.currentProjectId = id; saveLayer(layer);
        renderProjects();
        refreshAll();
        safeToast('Loaded “' + p.name + '”');
        this.close();
      },
      duplicate(id) {
        const list = loadProjects();
        const p = list.find(x => x.id === id); if (!p) return;
        const copy = JSON.parse(JSON.stringify(p));
        copy.id = 'p' + Date.now();
        copy.name = p.name + ' (copy)';
        copy.updatedAt = Date.now();
        list.unshift(copy);
        saveProjects(list);
        renderProjects();
      },
      rename(id) {
        const list = loadProjects();
        const p = list.find(x => x.id === id); if (!p) return;
        const name = prompt('Rename project', p.name);
        if (!name) return;
        p.name = name; p.updatedAt = Date.now();
        saveProjects(list);
        renderProjects();
      },
      remove(id) {
        if (!confirm('Delete this project? This cannot be undone.')) return;
        let list = loadProjects();
        list = list.filter(x => x.id !== id);
        saveProjects(list);
        if (SAAS.state.currentProjectId === id) {
          SAAS.state.currentProjectId = null;
          const layer = loadLayer(); layer.currentProjectId = null; saveLayer(layer);
        }
        renderProjects();
      }
    };
  }

  function renderProjects() {
    const body = document.getElementById('saas-drawer-body');
    if (!body) return;
    const list = loadProjects().slice().sort((a, b) => b.updatedAt - a.updatedAt);
    if (!list.length) {
      body.innerHTML = `<div class="saas-proj-empty">No saved projects yet. Click <strong>Save current</strong> below or create from a template.</div>`;
      return;
    }
    body.innerHTML = list.map(p => {
      const initials = (p.name || '?').split(/\s+/).map(s => s[0] || '').join('').slice(0, 2).toUpperCase();
      const date = new Date(p.updatedAt);
      const meta = date.toLocaleDateString() + ' · ' + (p.customer || 'No customer');
      const active = p.id === SAAS.state.currentProjectId;
      return `
        <div class="saas-proj-item ${active ? 'active' : ''}" data-id="${p.id}">
          <div class="saas-proj-mark">${initials}</div>
          <div class="saas-proj-info">
            <div class="saas-proj-name">${escapeHtml(p.name)}</div>
            <div class="saas-proj-meta">${escapeHtml(meta)}</div>
          </div>
          <div class="saas-proj-actions">
            <button class="saas-proj-iconbtn" data-act="rename" title="Rename">✎</button>
            <button class="saas-proj-iconbtn" data-act="dup" title="Duplicate">⎘</button>
            <button class="saas-proj-iconbtn" data-act="del" title="Delete">🗑</button>
          </div>
        </div>
      `;
    }).join('');

    body.querySelectorAll('.saas-proj-item').forEach(it => {
      const id = it.dataset.id;
      it.addEventListener('click', e => {
        const btn = e.target.closest('button[data-act]');
        if (btn) {
          e.stopPropagation();
          const act = btn.dataset.act;
          if (act === 'rename') SAAS.drawer.rename(id);
          if (act === 'dup') SAAS.drawer.duplicate(id);
          if (act === 'del') SAAS.drawer.remove(id);
          return;
        }
        SAAS.drawer.load(id);
      });
    });
  }

  function buildTour() {
    const overlay = document.createElement('div');
    overlay.className = 'saas-tour-overlay';
    overlay.id = 'saas-tour-overlay';
    overlay.innerHTML = `
      <div class="saas-tour-mask" id="saas-tour-mask"></div>
    `;
    document.body.appendChild(overlay);

    const popover = document.createElement('div');
    popover.className = 'saas-tour-popover';
    popover.id = 'saas-tour-popover';
    popover.style.display = 'none';
    document.body.appendChild(popover);

    let stepIdx = 0;

    function show(idx) {
      stepIdx = idx;
      const step = TOUR_STEPS[idx];
      if (!step) { close(); return; }
      overlay.classList.add('show');
      popover.style.display = 'block';

      // Move highlight
      document.querySelectorAll('.saas-tour-target').forEach(el => el.classList.remove('saas-tour-target'));
      let mask = 'none';
      if (step.target) {
        const tgt = document.querySelector(step.target);
        if (tgt) {
          tgt.classList.add('saas-tour-target');
          tgt.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const r = tgt.getBoundingClientRect();
          mask = `radial-gradient(ellipse ${(r.width / 2) + 24}px ${(r.height / 2) + 24}px at ${r.left + r.width / 2}px ${r.top + r.height / 2}px, transparent 70%, black 100%)`;
        }
      }
      document.getElementById('saas-tour-mask').style.setProperty('--mask', mask);

      // Position popover
      setTimeout(() => positionPopover(step), 120);

      const dots = TOUR_STEPS.map((_, i) =>
        `<span class="saas-tour-dot ${i === idx ? 'active' : i < idx ? 'done' : ''}"></span>`
      ).join('');

      popover.innerHTML = `
        <div class="saas-tour-step">Step ${idx + 1} of ${TOUR_STEPS.length}</div>
        <div class="saas-tour-title">${step.title}</div>
        <div class="saas-tour-body">${step.body}</div>
        <div class="saas-tour-actions">
          <div class="saas-tour-progress">${dots}</div>
          <div class="saas-tour-buttons">
            <button class="saas-btn saas-btn-ghost" data-tour="skip">Skip</button>
            ${idx > 0 ? '<button class="saas-btn saas-btn-out" data-tour="prev">Back</button>' : ''}
            <button class="saas-btn saas-btn-pri" data-tour="${idx === TOUR_STEPS.length - 1 ? 'finish' : 'next'}">${idx === TOUR_STEPS.length - 1 ? 'Got it' : 'Next →'}</button>
          </div>
        </div>
      `;

      popover.querySelectorAll('[data-tour]').forEach(b => {
        b.addEventListener('click', () => {
          const a = b.dataset.tour;
          if (a === 'next') show(idx + 1);
          else if (a === 'prev') show(idx - 1);
          else if (a === 'skip' || a === 'finish') close();
        });
      });
    }

    function positionPopover(step) {
      const popoverEl = document.getElementById('saas-tour-popover');
      if (!popoverEl) return;
      if (!step.target) {
        // Center
        popoverEl.style.left = (window.innerWidth / 2 - 180) + 'px';
        popoverEl.style.top = (window.innerHeight / 2 - 120) + 'px';
        return;
      }
      const tgt = document.querySelector(step.target);
      if (!tgt) {
        popoverEl.style.left = (window.innerWidth / 2 - 180) + 'px';
        popoverEl.style.top = '120px';
        return;
      }
      const r = tgt.getBoundingClientRect();
      const pw = 360, ph = 200;
      let left = r.right + 18;
      let top = r.top;
      if (left + pw > window.innerWidth - 12) {
        left = Math.max(12, r.left - pw - 18);
        if (left < 12) { left = 80; top = r.bottom + 14; }
      }
      if (top + ph > window.innerHeight - 12) top = window.innerHeight - ph - 14;
      if (top < 90) top = 90;
      popoverEl.style.left = left + 'px';
      popoverEl.style.top = top + 'px';
    }

    function close() {
      overlay.classList.remove('show');
      popover.style.display = 'none';
      document.querySelectorAll('.saas-tour-target').forEach(el => el.classList.remove('saas-tour-target'));
      const layer = loadLayer();
      layer.tourCompleted = true;
      saveLayer(layer);
      SAAS.state.tourCompleted = true;
    }

    SAAS.tour = {
      start(force) {
        if (force) {
          const layer = loadLayer(); layer.tourCompleted = false; saveLayer(layer);
        }
        show(0);
      }
    };

    window.addEventListener('resize', () => {
      if (overlay.classList.contains('show')) show(stepIdx);
    });
  }

    function applyDraftToHost() {
      // Project info
      setVal('projectName', draft.projectName);
      setVal('customerName', draft.customerName);
      setVal('siteAddress', draft.siteAddress);
      // Equipment
      if (draft.panelModel) setVal('panelModel', draft.panelModel);
      if (draft.inverterModel) setVal('inverterModel', draft.inverterModel);
      // Site
      setVal('exposureCat', draft.terrain || 'B');
      setVal('soilClass', draft.soil === 'unknown' ? 'SM' : (draft.soil || 'SM'));
      // Hazard-driven
      const wind = special2wind(draft.special, draft.terrain);
      const snow = draft.special === 'snow' ? 60 : 15;
      const seism = draft.special === 'seismic' ? 'D' : 'A';
      const sds = draft.special === 'seismic' ? 0.75 : 0.15;
      setVal('windSpeed', wind);
      setVal('snowLoad', snow);
      setVal('seismicCat', seism);
      setVal('sds', sds);
      if (draft.special === 'hurricane') setVal('riskCategory', 'III');
      // Trigger any change handlers the host has wired up.
      dispatchAll();
      // Generate the array.
      if (window.generateSystem) window.generateSystem(draft.kw);
      if (window.recalcAll) window.recalcAll();
    }

    SAAS.wizard = {
      open() {
        // Pre-populate from existing form if any.
        const f = window.getFormState ? window.getFormState() : {};
        draft.projectName = draft.projectName || f.projectName || '';
        draft.customerName = draft.customerName || f.customerName || '';
        draft.siteAddress = draft.siteAddress || f.siteAddress || '';

          draft.customerName = document.getElementById('wiz-customer').value;
          draft.siteAddress = document.getElementById('wiz-addr').value;
        }
        if (step === WIZARD_STEPS.length - 1) {
          captureUndo();
          withoutCapture(() => applyDraftToHost());
          this.close();
          safeToast('Wizard complete — your project is built.');
          refreshAll();
          return;
        }
        step++;
        renderStepper();
        renderBody();
      },
      back() {
        if (step === 0) return;
        step--;
        renderStepper();
        renderBody();
      }
    };
  }

      setVal('windSpeed', spec.windSpeed);
      setVal('exposureCat', spec.exposureCat);
      setVal('soilClass', spec.soilClass);
      setVal('snowLoad', spec.snowLoad);
      setVal('sds', spec.sds);
      setVal('seismicCat', spec.seismicCat || 'A');
      setVal('riskCategory', spec.riskCategory);
      setVal('frostDepth', spec.frostDepth);
      dispatchAll();
      host_setLayout([]);
      host_setNextSec(1);
      host_setNextRow(1);
      if (window.generateSystem) window.generateSystem(spec.kw);
      if (window.recalcAll) window.recalcAll();
    });
    refreshAll();
    safeToast('Template applied: ' + (spec.projectName || ''));
  }

  function buildModal() {
    const modal = document.createElement('div');
    modal.className = 'saas-modal';
    modal.id = 'saas-templates-modal';
    modal.innerHTML = `
      <div class="saas-modal-box">
        <div class="saas-modal-head">
          <div>
            <div class="saas-modal-title">Start a new project</div>
            <div class="saas-modal-sub">Pick a template, or open the Quick Start wizard for a guided setup.</div>
          </div>
          <button class="saas-modal-close" id="saas-templates-close">×</button>
        </div>
        <div class="saas-modal-body">
          <div class="saas-tpl-grid" id="saas-tpl-grid"></div>
          <div style="margin-top:18px;text-align:center">
            <button class="saas-btn saas-btn-out" id="saas-tpl-wizard">Or use the 5-step Quick Start wizard →</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('saas-templates-close').addEventListener('click', () => SAAS.modal.closeTemplates());
    modal.addEventListener('click', e => { if (e.target === modal) SAAS.modal.closeTemplates(); });
    document.getElementById('saas-tpl-wizard').addEventListener('click', () => {
      SAAS.modal.closeTemplates();
      setTimeout(() => SAAS.wizard.open(), 80);
    });

    SAAS.modal = {
      openTemplates() {
        renderTemplates();
        modal.classList.add('show');
      },
      closeTemplates() { modal.classList.remove('show'); }
    };

    function renderTemplates() {
      const g = document.getElementById('saas-tpl-grid');
      g.innerHTML = TEMPLATES.map(t => `
        <button class="saas-tpl-card" data-tpl="${t.id}" style="--tpl-c1:${t.colors[0]};--tpl-c2:${t.colors[1]}">
          <div class="saas-tpl-hero">${t.hero}</div>
          <div class="saas-tpl-name">${t.name}</div>
          <div class="saas-tpl-desc">${t.desc}</div>
          <div class="saas-tpl-tags">
            ${t.tags.map(tag => `<span class="saas-tpl-tag">${tag}</span>`).join('')}
          </div>
        </button>
      `).join('');
      g.querySelectorAll('[data-tpl]').forEach(b => {
        b.addEventListener('click', () => {
          const t = TEMPLATES.find(x => x.id === b.dataset.tpl);
          SAAS.modal.closeTemplates();
          setTimeout(() => t && t.apply(), 80);
        });
      });
    }
  }

  /* ────────────────────────────────────────────────────────────────────────
     FAB STACK (help, wizard, palette quick-access)
     ──────────────────────────────────────────────────────────────────────── */
  function buildFabs() {
    const stack = document.createElement('div');
    stack.className = 'saas-fabs';
    stack.id = 'saas-fabs';
    stack.innerHTML = `
      <button class="saas-fab" id="saas-fab-tour" title="Replay tour">
        ?
        <span class="saas-fab-tooltip">Replay tour</span>
      </button>
      <button class="saas-fab" id="saas-fab-templates" title="New from template">
        ✦
        <span class="saas-fab-tooltip">Templates</span>
      </button>
      <button class="saas-fab primary" id="saas-fab-wizard" title="Quick Start">
        ⇆
        <span class="saas-fab-tooltip">Quick Start wizard</span>
      </button>
    `;
    document.body.appendChild(stack);
    document.getElementById('saas-fab-tour').addEventListener('click', () => SAAS.tour.start(true));
    document.getElementById('saas-fab-templates').addEventListener('click', () => SAAS.modal.openTemplates());
    document.getElementById('saas-fab-wizard').addEventListener('click', () => SAAS.wizard.open());
  }

  /* ────────────────────────────────────────────────────────────────────────
     KEYBOARD SHORTCUTS
     ──────────────────────────────────────────────────────────────────────── */
  function bindShortcuts() {
    document.addEventListener('keydown', e => {
      const meta = e.ctrlKey || e.metaKey;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const isTyping = ['INPUT','TEXTAREA','SELECT'].includes(tag);

      // ⌘K command palette
      if (meta && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        SAAS.palette.open();
        return;
      }
      // ⌘Z undo, ⌘⇧Z redo
      if (meta && (e.key === 'z' || e.key === 'Z')) {
        if (isTyping) return; // let native undo work in inputs
        e.preventDefault();
        if (e.shiftKey) SAAS.undo.redo(); else SAAS.undo.undo();
        return;
      }
      // ⌘S save current project
      if (meta && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        SAAS.drawer.saveCurrent();
        return;
      }
      // ? show tour
      if (e.key === '?' && !isTyping) {
        e.preventDefault();
        SAAS.tour.start(true);
      }
      // ESC close overlays
      if (e.key === 'Escape') {
        document.getElementById('saas-palette-overlay')?.classList.remove('show');
        document.getElementById('saas-templates-modal')?.classList.remove('show');
        document.getElementById('saas-drawer')?.classList.remove('show');
      }
    });
  }

  /* ────────────────────────────────────────────────────────────────────────
     SCROLL SPY · highlight rail item for current section
     ──────────────────────────────────────────────────────────────────────── */
  function bindScrollSpy() {
    if (typeof IntersectionObserver === 'undefined') return; // jsdom / very old browsers
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          document.querySelectorAll('.saas-rail-item').forEach(i => i.classList.remove('active'));
          const railItem = document.querySelector(`.saas-rail-item[data-target="${id}"]`);
          if (railItem) railItem.classList.add('active');
        }
      });
    }, { rootMargin: '-30% 0px -55% 0px', threshold: 0 });

    SAAS.sections.forEach(s => {
      const el = document.getElementById(s.id);
      if (el) observer.observe(el);
    });
  }

  /* ────────────────────────────────────────────────────────────────────────
     CHANGE WATCHERS · refresh on form mutations
     ──────────────────────────────────────────────────────────────────────── */
  function setupChangeWatchers() {
    document.addEventListener('input', e => {
      if (e.target.matches('input, select, textarea')) {
        // Throttle
        clearTimeout(SAAS._refreshT);
        SAAS._refreshT = setTimeout(refreshAll, 200);
      }
    });
    document.addEventListener('change', e => {
      if (e.target.matches('input, select, textarea')) {
        // For form changes, capture an undo snapshot too (debounced).
        clearTimeout(SAAS._undoT);
        SAAS._undoT = setTimeout(() => {
          captureUndo();
          refreshAll();
        }, 600);
      }
    });
  }

  function refreshAll() {
    refreshStatuses();
    refreshProgress();
  }

  /* ────────────────────────────────────────────────────────────────────────
     UTILITIES
     ──────────────────────────────────────────────────────────────────────── */
  function setVal(id, v) {
    const el = document.getElementById(id);
    if (!el || v === undefined || v === null) return;
    if (el.tagName === 'SELECT' || el.type === 'checkbox') {
      el.value = v;
    } else {
      el.value = v;
    }
  }
  function dispatchAll() {
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.dispatchEvent(new Event('change', { bubbles: true }));
      el.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // Expose for debugging
  window.SAAS = SAAS;
})();
</script>
